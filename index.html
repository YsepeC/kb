<!doctype html>
<html lang="zh-CN" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Lumen 剧场</title>
<style>
  :root{
    --bg1:#070a12; --bg2:#111a30; --bg3:#1a2140;
    --panel:rgba(20,26,44,.62); --panel-solid:#141a2c; --card:rgba(26,32,52,.55);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
    --text:#ece9f6; --muted:#9d9ab8;
    --accent:#7c6cf6; --accent2:#38e8c8; --danger:#f87171;
    --glow:rgba(124,108,246,.42); --shadow:0 18px 50px rgba(0,0,0,.45);
    --serif:"Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
    --blur:saturate(160%) blur(18px);
    --hero-filter:blur(40px) saturate(140%) brightness(.58);
    --hero-veil:linear-gradient(to bottom, transparent 6%, var(--bg1) 94%);
    --fx-type:bubble;
  }
  html[data-theme="sakura"]{
    --bg1:#fffafc; --bg2:#ffeef4; --bg3:#ffe2ec;
    --panel:rgba(255,255,255,.72); --panel-solid:#fffdfe; --card:rgba(255,255,255,.66);
    --line:rgba(140,80,105,.16); --line-strong:rgba(140,80,105,.3);
    --text:#31242c; --muted:#946e7d;
    --accent:#d95f86; --accent2:#f2a0bb; --danger:#c93d5c;
    --glow:rgba(217,95,134,.3); --shadow:0 18px 44px rgba(150,80,110,.18);
    --hero-filter:blur(44px) saturate(118%) brightness(1.14);
    --hero-veil:linear-gradient(to bottom, color-mix(in srgb,var(--bg1) 55%, transparent) 2%, var(--bg1) 96%);
    --fx-type:petal;
  }
  html[data-theme="noir"]{
    --bg1:#070606; --bg2:#19130f; --bg3:#241b12;
    --panel:rgba(30,25,20,.7); --panel-solid:#1b1713; --card:rgba(38,31,23,.6);
    --line:rgba(201,162,39,.2); --line-strong:rgba(201,162,39,.36);
    --text:#f4edda; --muted:#b0a288;
    --accent:#c9a227; --accent2:#f2dfa0; --danger:#e0664f;
    --glow:rgba(201,162,39,.32); --shadow:0 18px 44px rgba(0,0,0,.5);
    --hero-filter:blur(40px) saturate(130%) brightness(.5);
    --hero-veil:linear-gradient(to bottom, transparent 6%, var(--bg1) 94%);
    --fx-type:spark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    color:var(--text);overflow:hidden;position:relative;
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    background:
      radial-gradient(1100px 720px at 8% -12%, color-mix(in srgb,var(--accent) 34%,transparent), transparent 62%),
      radial-gradient(900px 680px at 108% 4%, color-mix(in srgb,var(--accent2) 22%,transparent), transparent 64%),
      radial-gradient(800px 800px at 50% 118%, color-mix(in srgb,var(--accent) 18%,transparent), transparent 62%),
      linear-gradient(168deg, var(--bg1), var(--bg2) 62%, var(--bg3));
    background-attachment:fixed;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.28) 100%);
    mix-blend-mode:multiply;opacity:.55;
  }
  .fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .fx i{
    position:absolute;border-radius:50%;display:block;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb,var(--accent2) 78%,transparent), color-mix(in srgb,var(--accent) 42%,transparent) 58%, transparent 72%);
    border:1px solid color-mix(in srgb,var(--accent2) 24%,transparent);
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translate3d(0,108vh,0) scale(.65);opacity:0}
    14%{opacity:.5}
    100%{transform:translate3d(30px,-14vh,0) scale(1.2);opacity:0}
  }
  .aurora{position:fixed;inset:-25% -15%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.5}
  .aurora i{position:absolute;border-radius:50%;display:block;mix-blend-mode:screen;animation:drift 28s ease-in-out infinite alternate}
  .aurora i:nth-child(2){animation-duration:36s;animation-direction:alternate-reverse}
  .aurora i:nth-child(3){animation-duration:44s}
  @keyframes drift{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(7%,5%,0) scale(1.14)}}
  .fx i.petal{
    border-radius:62% 0 62% 0;border:0;
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 34%, #fff), color-mix(in srgb,var(--accent2) 62%, #fff));
    animation-name:fall;
  }
  @keyframes fall{
    0%{transform:translate3d(0,-12vh,0) rotate(0deg);opacity:0}
    12%{opacity:.8}
    100%{transform:translate3d(46px,112vh,0) rotate(340deg);opacity:0}
  }
  .fx i.spark{
    border:0;background:radial-gradient(circle, color-mix(in srgb,var(--accent2) 95%,#fff), transparent 70%);
    animation-name:twinkle;
  }
  @keyframes twinkle{0%,100%{opacity:.06;transform:scale(.6)}50%{opacity:.85;transform:scale(1)}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;opacity:0;pointer-events:none;transform:translateX(14px);transition:opacity .22s ease, transform .22s ease}
  .screen.on{opacity:1;pointer-events:auto;transform:none}

  /* ============ 角色库 ============ */
  .topbar{display:flex;align-items:flex-end;gap:10px;padding:18px 18px 10px;padding-top:calc(20px + env(safe-area-inset-top))}
  .brand{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em;line-height:1.1}
  .brand em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;margin-top:6px;font-family:inherit;font-size:10px;color:var(--muted);letter-spacing:.32em;text-transform:uppercase}
  .spacer{flex:1}
  .iconbtn{
    width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    backdrop-filter:var(--blur);color:var(--text);font-size:16px;display:grid;place-items:center;cursor:pointer;transition:.15s;
  }
  .iconbtn:active{transform:scale(.94)}
  .lib{flex:1;overflow-y:auto;padding:4px 18px calc(104px + env(safe-area-inset-bottom));position:relative;z-index:1;-webkit-overflow-scrolling:touch}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{
    position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);
    background:var(--card);backdrop-filter:var(--blur);cursor:pointer;
    box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
    animation:rise .42s cubic-bezier(.2,.7,.2,1) both;
  }
  .card:active{transform:scale(.972);box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .card .thumb{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;background:
    radial-gradient(circle at 50% 26%, color-mix(in srgb,var(--accent) 46%,transparent), transparent 72%),
    linear-gradient(160deg, color-mix(in srgb,var(--accent) 26%,transparent), color-mix(in srgb,var(--accent2) 16%,transparent))}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.01);transition:transform .4s}
  .card:active .thumb img{transform:scale(1.04)}
  .card .thumb .ph{font-size:36px;opacity:.8;filter:drop-shadow(0 2px 10px var(--glow))}
  .card .info{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent, rgba(6,8,14,.9) 68%)}
  .card .name{font-family:var(--serif);font-weight:600;font-size:15px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.75)}
  .card .tag{font-size:11px;color:rgba(255,255,255,.72);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .empty-lib{
    margin-top:16px;padding:34px 22px;border:1px dashed var(--line-strong);border-radius:24px;text-align:center;
    color:var(--muted);font-size:13.5px;line-height:2.1;background:color-mix(in srgb,var(--panel) 55%,transparent);
  }
  .empty-lib .orb{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, color-mix(in srgb,var(--accent2) 90%,transparent), color-mix(in srgb,var(--accent) 60%,transparent) 60%, transparent 74%);
    box-shadow:0 0 46px var(--glow);animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.06);opacity:1}}
  .empty-lib b{color:var(--text)}
  .fab{
    position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));height:54px;padding:0 24px;border-radius:28px;
    border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 40%,var(--accent2)));
    color:#fff;font-weight:650;font-size:15px;cursor:pointer;z-index:5;
    box-shadow:0 16px 38px var(--glow), inset 0 1px 0 rgba(255,255,255,.28);transition:.15s;
  }
  .fab:active{transform:scale(.96)}

  /* ============ 聊天 ============ */
  .chat-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
  .chat-hero{position:absolute;left:0;right:0;top:0;height:230px;overflow:hidden;pointer-events:none;z-index:0}
  .chat-hero .bg{position:absolute;inset:-50px;background-size:cover;background-position:center;filter:var(--hero-filter);transform:scale(1.18)}
  .chat-hero .overlay{position:absolute;inset:0;background:var(--hero-veil)}
  .chat-head{
    position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:14px 15px;
    padding-top:calc(14px + env(safe-area-inset-top));
  }
  .avatar-wrap{position:relative;flex:0 0 auto}
  .avatar-wrap::after{content:"";position:absolute;inset:-4px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));opacity:.28;filter:blur(7px);z-index:-1}
  .avatar{width:46px;height:46px;border-radius:16px;object-fit:cover;border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 22px rgba(0,0,0,.4)}
  .avatar.ph{display:grid;place-items:center;font-size:20px;background:var(--panel)}
  .chat-head .who{min-width:0}
  .chat-head .who b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
  .chat-head .who span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 9px var(--accent2);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:10px 15px 10px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  .row-msg{display:flex;gap:10px;align-items:flex-end;max-width:93%;animation:pop .26s cubic-bezier(.2,.7,.2,1) both}
  .row-msg.me{align-self:flex-end;flex-direction:row-reverse}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .row-msg .mini{width:30px;height:30px;border-radius:11px;object-fit:cover;flex:0 0 auto;border:1px solid var(--line);background:var(--panel)}
  .bubble{
    position:relative;padding:12px 15px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7;
    border:1px solid var(--line);background:var(--panel);backdrop-filter:var(--blur);box-shadow:0 10px 26px rgba(0,0,0,.22);
  }
  .row-msg.me .bubble{
    background:linear-gradient(135deg, color-mix(in srgb,var(--accent) 90%, #000 3%), color-mix(in srgb,var(--accent) 46%, var(--accent2)));
    border-color:transparent;color:#fff;box-shadow:0 12px 28px var(--glow);
  }
  .bubble.typing{display:flex;gap:5px;align-items:center;padding:15px 17px}
  .bubble.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite}
  .bubble.typing i:nth-child(2){animation-delay:.18s}
  .bubble.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{transform:translateY(0);opacity:.32}30%{transform:translateY(-4px);opacity:1}}
  .bubble.err{border-color:color-mix(in srgb,var(--danger) 45%, transparent);color:var(--danger);font-size:13px}
  .acts{display:flex;gap:14px;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .acts button{border:0;background:none;color:inherit;font-size:11.5px;padding:0;cursor:pointer;opacity:.9}
  .acts button:active{color:var(--accent)}
  .sysline{align-self:center;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 13px;background:color-mix(in srgb,var(--panel) 72%,transparent);cursor:pointer}
  .suggest{position:relative;z-index:2;display:flex;gap:8px;overflow-x:auto;padding:2px 15px 9px;scrollbar-width:none}
  .suggest::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--text);
    border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;backdrop-filter:var(--blur);transition:.15s;
  }
  .chip:active{transform:scale(.95);border-color:var(--line-strong)}
  #composer{
    position:relative;z-index:3;border-top:1px solid var(--line);padding:10px 13px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--panel-solid) 74%, transparent);backdrop-filter:var(--blur);
    display:flex;gap:9px;align-items:flex-end;
  }
  #input{
    flex:1;min-height:46px;max-height:132px;resize:none;border-radius:16px;border:1px solid var(--line);
    background:color-mix(in srgb, var(--bg1) 52%, transparent);color:var(--text);padding:12px 15px;font:inherit;outline:none;transition:.15s;
  }
  #input:focus{border-color:color-mix(in srgb,var(--accent) 55%, transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
  #send{height:46px;min-width:70px;padding:0 18px;border-radius:16px;border:0;cursor:pointer;font-weight:650;font-size:14px;color:#fff;
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 42%,var(--accent2)));
    box-shadow:0 10px 24px var(--glow);transition:.15s}
  #send:active{transform:scale(.97)}
  #send:disabled{opacity:.38;box-shadow:none}

  /* ============ 表单 ============ */
  .form{flex:1;overflow-y:auto;padding:14px 17px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label{font-size:12px;color:var(--muted);letter-spacing:.05em}
  .field input,.field textarea,.field select{
    width:100%;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg1) 46%,transparent);
    color:var(--text);padding:12px 14px;font:inherit;outline:none;transition:.15s;
  }
  .field textarea{min-height:96px;resize:vertical;line-height:1.6}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.8}
  .btn{
    border:1px solid var(--line);background:var(--panel);backdrop-filter:var(--blur);color:var(--text);
    border-radius:14px;padding:11px 16px;font-size:14px;cursor:pointer;transition:.15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 42%,var(--accent2)));border-color:transparent;color:#fff;font-weight:650}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 36%, transparent)}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  .sec-title{font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;color:var(--muted);margin:8px 2px 0}
  .divider{height:1px;background:var(--line);margin:6px 0}
  .avatar-edit{display:flex;align-items:center;gap:12px}
  .avatar-edit img{width:64px;height:64px;border-radius:18px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}

  /* ============ sheet / toast ============ */
  .toast{
    position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:color-mix(in srgb,var(--panel-solid) 95%, transparent);border:1px solid var(--line-strong);color:var(--text);
    padding:11px 18px;border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:86vw;text-align:center;backdrop-filter:var(--blur);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
  .sheet-mask.on{display:flex}
  .sheet{
    width:100%;max-height:84vh;overflow-y:auto;background:var(--panel-solid);border-radius:26px 26px 0 0;
    border-top:1px solid var(--line-strong);padding:20px 17px calc(22px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 14px;font-family:var(--serif);font-size:18px;font-weight:600}
  .greet-item{
    text-align:left;width:100%;margin-bottom:10px;padding:13px 14px;border-radius:15px;border:1px solid var(--line);
    background:color-mix(in srgb,var(--bg1) 42%,transparent);color:var(--text);font-size:13.5px;line-height:1.6;cursor:pointer;transition:.15s;
  }
  .greet-item:active{transform:scale(.99);border-color:var(--line-strong)}
  .greet-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
  .mem-box{width:100%;min-height:160px;border-radius:15px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg1) 46%,transparent);color:var(--text);padding:12px;font:inherit;line-height:1.65;resize:vertical}
</style>
</head>
<body>
<div class="fx" id="fx"></div>

<!-- ============ 角色库 ============ -->
<section class="screen on" id="s-lib">
  <div class="topbar">
    <div class="brand">Lumen <em>剧场</em><small>character playground · v6</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnTheme" title="切换主题">◐</button>
    <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
  </div>
  <div class="lib">
    <div class="cards" id="cards"></div>
    <div class="empty-lib" id="emptyLib">
      <div class="orb"></div>
      还没有角色。<br>
      点右下角 <b>＋ 新角色</b> 现场捏一个，<br>或者导入 <b>JSON / PNG 角色卡</b>。<br>
      <span style="opacity:.72">支持 Tavern · SillyTavern · Chub v2</span>
    </div>
  </div>
  <button class="fab" id="btnAdd">＋ 新角色</button>
</section>

<!-- ============ 聊天 ============ -->
<section class="screen" id="s-chat">
  <div class="chat-wrap">
    <div class="chat-hero"><div class="bg" id="heroBg"></div><div class="overlay"></div></div>
    <div class="chat-head">
      <button class="iconbtn" id="btnBack">‹</button>
      <div class="avatar-wrap"><img class="avatar" id="chatAvatar" alt=""></div>
      <div class="who"><b id="chatName">—</b><span><i class="dot"></i><em id="chatTag" style="font-style:normal">在线</em></span></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="btnChatMenu">⋯</button>
    </div>
    <div id="msgs"></div>
    <div class="suggest" id="suggest"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">发送</button>
    </div>
  </div>
</section>

<!-- ============ 角色编辑 ============ -->
<section class="screen" id="s-edit">
  <div class="chat-head">
    <button class="iconbtn" id="btnEditBack">‹</button>
    <div class="who"><b id="editTitle">新角色</b><span>角色卡编辑</span></div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnSaveChar" style="padding:9px 16px">保存</button>
  </div>
  <div class="form">
    <div class="avatar-edit">
      <img id="avatarPreview" alt="" style="display:none">
      <label class="btn" style="cursor:pointer">选头像<input type="file" id="avatarFile" accept="image/*" hidden></label>
      <button class="btn" id="btnDelChar" hidden>删除</button>
      <button class="btn" id="btnExportChar" hidden>导出卡片</button>
    </div>
    <div class="field"><label>名字</label><input id="fName" placeholder="例如：银时的猫"></div>
    <div class="field"><label>一句话介绍</label><input id="fTag" placeholder="显示在角色卡下方"></div>
    <div class="field"><label>描述 / 人设</label><textarea id="fDesc" placeholder="外貌、身份、背景、说话方式…"></textarea></div>
    <div class="field"><label>性格</label><textarea id="fPers" placeholder="关键词或短句，例如：嘴硬心软，护短，爱吐槽"></textarea></div>
    <div class="field"><label>场景</label><textarea id="fScene" placeholder="故事发生在哪里、此刻发生了什么"></textarea></div>
    <div class="field"><label>开场白</label><textarea id="fGreet" placeholder="角色的第一句话（可以带动作）"></textarea></div>
    <div class="field"><label>示例对话（可选）</label><textarea id="fEx" placeholder="&lt;START&gt;&#10;角色：…&#10;你：…"></textarea></div>
    <div class="field"><label>额外系统提示（可选）</label><textarea id="fSys" placeholder="例如：不要替用户行动、保持短句"></textarea></div>
    <p class="hint">描述、性格、场景、示例对话都会作为角色的「记忆」每轮带上。示例对话最能稳定语气。</p>
  </div>
</section>

<!-- ============ 设置 ============ -->
<section class="screen" id="s-set">
  <div class="chat-head" style="background:transparent">
    <button class="iconbtn" id="btnSetBack">‹</button>
    <div class="who"><b>设置</b><span>接口 · 主题 · 数据</span></div>
  </div>
  <div class="form">
    <div class="sec-title">模型接口</div>
    <div class="field"><label>Base URL</label><input id="cfgBase" placeholder="https://api.deepseek.com"></div>
    <div class="field"><label>API Key（只存这台设备）</label><input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off"></div>
    <div class="field">
      <label>模型</label>
      <div style="display:flex;gap:8px">
        <input id="cfgModel" placeholder="deepseek-chat" style="flex:1">
        <button class="btn" id="btnFetchModels" style="white-space:nowrap;padding:11px 14px">拉取列表</button>
      </div>
      <select id="cfgModelSelect" style="margin-top:8px;display:none"></select>
    </div>
    <div class="field"><label>温度（0.6 稳 / 1.0 野）</label><input id="cfgTemp" type="number" min="0" max="2" step="0.05"></div>
    <div class="btnrow"><button class="btn primary" id="btnSaveCfg">保存</button><button class="btn" id="btnTestCfg">测试连接</button></div>

    <div class="divider"></div>
    <div class="sec-title">长期记忆</div>
    <div class="field"><label>自动整理前情</label>
      <select id="cfgAutoMem"><option value="1">开（每段对话自动摘要一次）</option><option value="0">关（只能手动整理）</option></select>
    </div>
    <p class="hint">开启后，旧剧情会被压成一段「前情提要」长期保留，不会因为消息太多而被忘掉。可以在聊天菜单里手动查看和编辑。</p>

    <div class="divider"></div>
    <div class="sec-title">外观</div>
    <div class="field"><label>主题</label>
      <select id="cfgTheme">
        <option value="midnight">午夜紫（暗）</option>

        <option value="noir">黑金（暗）</option>

      <button class="btn" id="btnExportAll">导出全部</button>
      <button class="btn" id="btnImportAll">导入备份</button>
      <input type="file" id="importAllFile" accept="application/json,.json" hidden>
    </div>
    <div class="btnrow">
      <button class="btn" id="btnRepair">修复乱码角色</button>
      <button class="btn danger" id="btnClearAll">清空全部角色与对话</button>
    </div>
    <p class="hint">纯静态：角色、对话、记忆、API Key 都只存在这台设备的浏览器里。</p>
  </div>

<div class="sheet-mask" id="sheetMask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const LS = { cfg: 'lumen6.cfg', chars: 'lumen6.chars', chats: 'lumen6.chats', mem: 'lumen6.mem', theme: 'lumen6.theme' };
  const LEGACY = ['lumen5','lumen4','lumen3'];
  const DEFAULT_CFG = { base: 'https://api.deepseek.com', model: 'deepseek-chat', key: '', temp: 0.88, autoMem: true };
  const HISTORY = 12, FOLD_AT = 12;

  const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? JSON.parse(JSON.stringify(d)) : JSON.parse(v); } catch { return JSON.parse(JSON.stringify(d)); } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('存储满了，清掉一些旧对话吧'); } };

  const looksMojibake = v => typeof v === 'string' && /[\u00c3\u00c2\u00e5\u00e6\u00e8\u00e9]/.test(v) && !/[\u4e00-\u9fa5]/.test(v);
  function migrateLegacy() {
    if (localStorage.getItem(LS.chars)) return;
    for (const key of LEGACY) {
      const old = load(key + '.chars', []);
      if (!Array.isArray(old) || !old.length) continue;
      const good = old.filter(c => c && !looksMojibake(c.name) && !looksMojibake(c.greet || '') && !looksMojibake(c.tag || ''));
      if (good.length) { chars = good; save(LS.chars, chars); }
      const oldChats = load(key + '.chats', {});
      if (oldChats && typeof oldChats === 'object') { chats = oldChats; save(LS.chats, chats); }
      break;
    }
  }

  let cfg = Object.assign({}, DEFAULT_CFG, load(LS.cfg, {}));
  let chars = load(LS.chars, []);
  let chats = load(LS.chats, {});
  let mem = load(LS.mem, {});
  let theme = load(LS.theme, 'midnight');
  let curId = null, editingId = null, editAvatar = '', busy = false;

  let toastTimer = 0;
  function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2100); }
  function show(id) { $$('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
  const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  /* base64 → UTF-8 字符串（PNG 角色卡的 chara 是 UTF-8 JSON 的 base64） */
  function b64ToUtf8(b64) {
    const bin = atob(String(b64).replace(/\s+/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  /* PNG 里的 tEXt 规范是 Latin-1，但很多人写的是 UTF-8 字节，这里兼容两种 */
  function latin1ToText(s) {
    try {
      const bytes = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 0xff;
      const utf8 = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return utf8;
    } catch { return s; }
  }

  function applyTheme(t) {
    theme = t; document.documentElement.dataset.theme = t; save(LS.theme, t);
    document.querySelector('meta[name=theme-color]').setAttribute('content', { midnight: '#070a12', sakura: '#fffafc', noir: '#070606' }[t] || '#070a12');
    $('#cfgTheme').value = t;
    buildFx();
  }
  function buildFx() {
    const fx = $('#fx'); fx.innerHTML = '';
    const aurora = document.createElement('div'); aurora.className = 'aurora';
    for (let i = 0; i < 3; i++) {
      const b = document.createElement('i');
      const size = 36 + Math.random() * 34;
      b.style.width = b.style.height = size + 'vmin';
      b.style.left = (i * 30 + Math.random() * 20) + '%';
      b.style.top = (Math.random() * 60 - 10) + '%';
      b.style.background = (i % 2 ? 'radial-gradient(circle, color-mix(in srgb, var(--accent2) 55%, transparent), transparent 66%)'
                                  : 'radial-gradient(circle, color-mix(in srgb, var(--accent) 60%, transparent), transparent 68%)');
      aurora.append(b);
    }
    fx.append(aurora);

    const kind = { midnight: 'bubble', sakura: 'petal', noir: 'spark' }[theme] || 'bubble';
    const n = kind === 'spark' ? 22 : kind === 'petal' ? 18 : 14;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('i');
      if (kind !== 'bubble') b.className = kind;
      const size = kind === 'petal' ? (9 + Math.random() * 10) : kind === 'spark' ? (3 + Math.random() * 4) : (7 + Math.random() * 46);
      b.style.width = b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (kind === 'spark' ? (3 + Math.random() * 4) : (16 + Math.random() * 24)) + 's';
      b.style.animationDelay = (-Math.random() * (kind === 'spark' ? 6 : 30)) + 's';
      b.style.opacity = kind === 'spark' ? '.0' : (0.14 + Math.random() * 0.34).toFixed(2);
      fx.append(b);
    }
  }

  /* ---------- 角色库 ---------- */
  function renderLibrary() {
    const box = $('#cards');
    $('#emptyLib').style.display = chars.length ? 'none' : 'block';
    box.innerHTML = '';
    chars.forEach((c, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.animationDelay = (i * 45) + 'ms';
      el.innerHTML = '<div class="thumb">' + (c.avatar ? '<img alt="">' : '<span class="ph">✦</span>') + '</div>' +
        '<div class="info"><div class="name">' + esc(c.name) + '</div><div class="tag">' + esc(c.tag || '') + '</div></div>';
      if (c.avatar) el.querySelector('img').src = c.avatar;
      el.onclick = () => openChat(c.id);
      el.oncontextmenu = e => { e.preventDefault(); charMenu(c.id); };
      let timer = 0;
      el.addEventListener('touchstart', () => { timer = setTimeout(() => charMenu(c.id), 520); }, { passive: true });
      el.addEventListener('touchend', () => clearTimeout(timer));
      el.addEventListener('touchmove', () => clearTimeout(timer));
      box.append(el);
    });
  }

  function charMenu(id) {
    const c = chars.find(x => x.id === id); if (!c) return;
    openSheet('「' + c.name + '」', [
      { label: '编辑角色', run: () => openEditor(id) },
      { label: '查看长期记忆', run: () => memorySheet(id) },
      { label: '重新开始', run: () => { if (confirm('清空和「' + c.name + '」的对话与前情？')) { delete chats[id]; delete mem[id]; save(LS.chats, chats); save(LS.mem, mem); toast('已重新开始'); } } },
      { label: '删除角色', danger: true, run: () => { if (confirm('删除「' + c.name + '」？')) { chars = chars.filter(x => x.id !== id); delete chats[id]; delete mem[id]; save(LS.chars, chars); save(LS.chats, chats); save(LS.mem, mem); renderLibrary(); toast('已删除'); } } }
    ]);
  }

  /* ---------- 聊天 ---------- */
  const currentChar = () => chars.find(c => c.id === curId) || null;
  const currentChat = () => (chats[curId] = chats[curId] || []);
  const currentMem = () => (mem[curId] = mem[curId] || { summary: '', lastFold: 0 });

  function openChat(id) {
    const c = chars.find(x => x.id === id); if (!c) return;
    curId = id;
    $('#chatName').textContent = c.name;
    $('#chatTag').textContent = c.tag || '在线';
    const av = $('#chatAvatar');
    if (c.avatar) { av.src = c.avatar; av.style.display = ''; $('#heroBg').style.backgroundImage = 'url(' + c.avatar + ')'; }
    else { av.style.display = 'none'; $('#heroBg').style.backgroundImage = 'none'; }
    const list = currentChat();
    if (!list.length) {
      list.push({ role: 'assistant', content: c.greet || ('（' + c.name + ' 看了你一眼）'), ts: Date.now() });
      save(LS.chats, chats);
    }
    renderChat(); renderSuggest(); show('s-chat');
  }

  function renderChat() {
    const c = currentChar(); const box = $('#msgs'); const list = currentChat(); const m = currentMem();
    box.innerHTML = '';
    if (m.summary) {
      const s = document.createElement('div'); s.className = 'sysline';
      s.textContent = '前情提要 · 已记住 ' + m.summary.length + ' 字';
      s.onclick = () => memorySheet(c.id);
      box.append(s);
    }
    list.forEach((msg, i) => {
      const row = document.createElement('div');
      row.className = 'row-msg' + (msg.role === 'user' ? ' me' : '');
      if (msg.role !== 'user') {
        const mini = document.createElement('img'); mini.className = 'mini';
        if (c && c.avatar) mini.src = c.avatar; else mini.style.visibility = 'hidden';
        row.append(mini);
      }
      const b = document.createElement('div');
      b.className = 'bubble' + (msg.role === 'error' ? ' err' : '');
      b.innerHTML = md(msg.content || '');
      if (msg.role === 'assistant') {
        const acts = document.createElement('div'); acts.className = 'acts';
        const b1 = document.createElement('button'); b1.textContent = '重说'; b1.onclick = () => regen(i);
        const b2 = document.createElement('button'); b2.textContent = '复制'; b2.onclick = () => navigator.clipboard?.writeText(msg.content || '').then(() => toast('已复制'));
        acts.append(b1, b2); b.append(acts);
      }
      row.append(b); box.append(row);
    });
    box.scrollTop = box.scrollHeight;
  }

  const SUGGESTS = ['继续', '（看着他）', '笑了一下', '嗯？', '说说你自己', '换个话题'];
  function renderSuggest() {
    const box = $('#suggest'); box.innerHTML = '';
    SUGGESTS.forEach(t => {
      const c = document.createElement('button'); c.className = 'chip'; c.textContent = t;
      c.onclick = () => { const inp = $('#input'); inp.value = inp.value + t; inp.focus(); };
      box.append(c);
    });
  }

  function buildMessages() {
    const c = currentChar(); const list = currentChat(); const m = currentMem();
    const p = [];
    p.push('你正在进行角色扮演。你就是下面的角色：第一人称说话，不跳出角色，不解释自己是 AI，不替用户写他的行动和心理。');
    p.push('# 角色\n名字：' + c.name);
    if (c.desc) p.push('描述：\n' + c.desc);
    if (c.pers) p.push('性格：\n' + c.pers);
    if (c.scene) p.push('场景：\n' + c.scene);
    if (c.ex) p.push('说话风格示例：\n' + c.ex);
    if (c.sys) p.push('额外要求：\n' + c.sys);
    if (m.summary) p.push('# 前情提要（你们之前发生的事，必须当作已经发生）\n' + m.summary);
    p.push('要求：像真人聊天，通常 1–4 段；允许用 *星号* 或（）写动作神态；不要每次都以提问结尾。');
    const msgs = [{ role: 'system', content: p.join('\n\n') }];
    list.filter(x => x.role === 'user' || x.role === 'assistant').slice(-HISTORY)
      .forEach(x => msgs.push({ role: x.role, content: x.content }));
    return msgs;
  }

  const apiUrl = path => (cfg.base || DEFAULT_CFG.base).replace(/\/+$/, '') + path;

  async function callModel(messages, opts = {}) {
    if (!cfg.key) throw new Error('还没填 API Key，去「设置」里填一个');
    const res = await fetch(apiUrl('/chat/completions'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model || DEFAULT_CFG.model, messages, temperature: opts.temp ?? cfg.temp ?? 0.88, max_tokens: opts.maxTokens ?? 900, stream: !!opts.stream })
    });
    if (!res.ok) { let d = ''; try { d = (await res.text()).slice(0, 240); } catch {} throw new Error('接口 ' + res.status + (d ? '：' + d : '')); }
    return opts.stream ? res : res.json();
  }

  async function send() {
    const input = $('#input'); const text = input.value.trim();
    if (!text || busy) return;
    input.value = ''; input.style.height = 'auto';
    currentChat().push({ role: 'user', content: text, ts: Date.now() });
    save(LS.chats, chats); renderChat();
    await reply();
  }

  async function reply() {
    if (busy) return;
    busy = true; $('#send').disabled = true;
    const list = currentChat();
    const row = document.createElement('div'); row.className = 'row-msg';
    const mini = document.createElement('img'); mini.className = 'mini';
    const av = (currentChar() || {}).avatar; if (av) mini.src = av; else mini.style.visibility = 'hidden';
    const bubble = document.createElement('div'); bubble.className = 'bubble typing';
    bubble.innerHTML = '<i></i><i></i><i></i>';
    row.append(mini, bubble); $('#msgs').append(row); $('#msgs').scrollTop = $('#msgs').scrollHeight;
    let acc = '';
    try {
      const res = await callModel(buildMessages(), { stream: true });
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop() || '';
        for (const line of lines) {
          const s = line.trim(); if (!s.startsWith('data:')) continue;
          const payload = s.slice(5).trim(); if (payload === '[DONE]') continue;
          try {
            const j = JSON.parse(payload); const d = j.choices?.[0]?.delta?.content;
            if (d) { acc += d; bubble.classList.remove('typing'); bubble.innerHTML = md(acc); $('#msgs').scrollTop = $('#msgs').scrollHeight; }
          } catch {}
        }
      }
      if (!acc) acc = '（没有收到内容）';
      row.remove();
      list.push({ role: 'assistant', content: acc, ts: Date.now() });
      save(LS.chats, chats); renderChat();
      if (cfg.autoMem) maybeFold();
    } catch (e) {
      row.remove();
      list.push({ role: 'error', content: '出错了：' + (e.message || e), ts: Date.now() });
      save(LS.chats, chats); renderChat();
    } finally { busy = false; $('#send').disabled = false; }
  }

  function regen(at) {
    const list = currentChat();
    if (at > 0 && list[at - 1]?.role === 'user') list.splice(at); else list.splice(at, 1);
    save(LS.chats, chats); renderChat(); reply();
  }

  /* ---------- 长期记忆 ---------- */
  async function maybeFold() {
    const list = currentChat(); const m = currentMem();
    if (list.length - m.lastFold < FOLD_AT + 6) return;
    const cut = list.length - 6;
    const chunk = list.slice(m.lastFold, cut).map(x => (x.role === 'user' ? '用户：' : '角色：') + x.content).join('\n');
    m.lastFold = cut; save(LS.mem, mem);
    await foldChunk(chunk);
  }
  async function foldChunk(chunk) {
    const m = currentMem();
    try {
      const sys = '你是剧情记忆整理器。把新发生的剧情合并进已有前情提要，输出一段简洁的中文提要（200–400 字），必须保留：人物关系、称呼、约定与承诺、重要事件与地点、发生的情绪转折。用第三人称叙述，不要写成分析或建议。只输出提要正文。';
      const userMsg = (m.summary ? '已有前情提要：\n' + m.summary + '\n\n' : '') + '新发生的剧情：\n' + chunk;
      const data = await callModel([{ role: 'system', content: sys }, { role: 'user', content: userMsg }], { temp: 0.3, maxTokens: 700 });
      const text = data.choices?.[0]?.message?.content?.trim();
      if (text) { m.summary = text; save(LS.mem, mem); toast('已整理前情记忆'); renderChat(); }
    } catch {}
  }
  async function foldNow() {
    const list = currentChat(); const m = currentMem();
    const cut = Math.max(0, list.length - 6);
    const chunk = list.slice(m.lastFold, cut).map(x => (x.role === 'user' ? '用户：' : '角色：') + x.content).join('\n');
    if (!chunk.trim()) return toast('还没有可以整理的旧剧情');
    toast('正在整理前情…');
    m.lastFold = cut; save(LS.mem, mem);
    await foldChunk(chunk);
  }
  function memorySheet(id) {
    curId = id; const m = currentMem(); const c = chars.find(x => x.id === id);
    openSheet('「' + c.name + '」的长期记忆', []);
    const box = $('#sheet');
    const ta = document.createElement('textarea'); ta.className = 'mem-box'; ta.value = m.summary || '';
    ta.placeholder = '还没有前情提要。聊到一定长度会自动生成，也可以点下面的按钮手动整理。';
    const row = document.createElement('div'); row.className = 'btnrow'; row.style.marginTop = '10px';
    const b1 = document.createElement('button'); b1.className = 'btn primary'; b1.textContent = '整理现在的前情';
    b1.onclick = async () => { closeSheet(); await foldNow(); setTimeout(() => memorySheet(id), 500); };
    const b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = '保存修改';
    b2.onclick = () => { m.summary = ta.value.trim(); save(LS.mem, mem); closeSheet(); renderChat(); toast('已保存'); };
    const b3 = document.createElement('button'); b3.className = 'btn danger'; b3.textContent = '清空记忆';
    b3.onclick = () => { if (confirm('清空这段剧情的前情提要？')) { m.summary = ''; m.lastFold = 0; save(LS.mem, mem); closeSheet(); renderChat(); toast('已清空'); } };
    row.append(b1, b2, b3);
    box.append(ta, row);
  }

  /* ---------- 角色卡解析 ---------- */
  function normalizeCard(raw, sourceName) {
    if (!raw || typeof raw !== 'object') throw new Error('不是有效的角色卡');
    const d = raw.data && typeof raw.data === 'object' ? raw.data : raw;
    return {
      id: uid(),
      name: String(d.name || d.char_name || sourceName || '无名角色').slice(0, 40),
      tag: String(d.creator_notes || d.tagline || d.creator || '').replace(/\s+/g, ' ').slice(0, 60),
      avatar: (typeof d.avatar === 'string' && d.avatar.startsWith('data:')) ? d.avatar : '',
      desc: String(d.description || ''),
      pers: String(d.personality || ''),
      scene: String(d.scenario || ''),
      greet: String(d.first_mes || d.greeting || ''),
      alts: Array.isArray(d.alternate_greetings) ? d.alternate_greetings.filter(x => typeof x === 'string') : [],
      ex: String(d.mes_example || d.example_dialogue || ''),
      sys: String(d.system_prompt || d.post_history_instructions || ''),
      createdAt: Date.now()
    };
  }

  async function cardFromPng(file) {
    const buf = new Uint8Array(await file.arrayBuffer());
    const sig = [137, 80, 78, 71, 13, 10, 26, 10];
    for (let i = 0; i < 8; i++) if (buf[i] !== sig[i]) throw new Error('不是 PNG 文件');
    const view = new DataView(buf.buffer);
    let off = 8, b64 = null, embedded = file.name.replace(/\.png$/i, '');
    while (off + 8 <= buf.length) {
      const len = view.getUint32(off);
      const type = String.fromCharCode(...buf.slice(off + 4, off + 8));
      const end = off + 8 + len;
      if (end > buf.length) break;
      if (type === 'tEXt' || type === 'iTXt') {
        const chunk = buf.slice(off + 8, end);
        const z = chunk.indexOf(0);
        if (z > 0) {
          const kw = String.fromCharCode(...chunk.slice(0, z)).toLowerCase();
          let text = '';
          if (type === 'tEXt') {
            text = new TextDecoder('latin1').decode(chunk.slice(z + 1));
            text = latin1ToText(text);
          } else {
            let p = z + 2 + 1; // keyword \0 compFlag compMethod
            const z1 = chunk.indexOf(0, p); p = z1 + 1;
            const z2 = chunk.indexOf(0, p); p = z2 + 1;
            text = new TextDecoder('utf-8').decode(chunk.slice(p));
          }
          if (kw === 'chara') b64 = text;
          if (kw === 'name' && text) embedded = text;
        }
      }
      off = end + 4;
    }
    if (!b64) throw new Error('这张 PNG 里没有角色卡数据（可能只是普通图片）');
    const json = JSON.parse(b64ToUtf8(b64.trim()));
    const card = normalizeCard(json, embedded);
    card.avatar = await downscaleImage(URL.createObjectURL(file), 640);
    return card;
  }

  async function cardFromFile(file) {
    if (/\.png$/i.test(file.name) || file.type === 'image/png') return cardFromPng(file);
    const text = await file.text();
    const json = JSON.parse(text);
    return normalizeCard(json, file.name.replace(/\.[^.]+$/, ''));
  }

  function downscaleImage(src, max) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = () => resolve('');
      img.src = src;
    });
  }

  /* ---------- 编辑 ---------- */
  function openEditor(id) {
    editingId = id || null; editAvatar = '';
    const c = id ? chars.find(x => x.id === id) : null;
    $('#editTitle').textContent = c ? c.name : '新角色';
    $('#fName').value = c ? c.name : '';
    $('#fTag').value = c ? (c.tag || '') : '';
    $('#fDesc').value = c ? (c.desc || '') : '';
    $('#fPers').value = c ? (c.pers || '') : '';
    $('#fScene').value = c ? (c.scene || '') : '';
    $('#fGreet').value = c ? (c.greet || '') : '';
    $('#fEx').value = c ? (c.ex || '') : '';
    $('#fSys').value = c ? (c.sys || '') : '';
    editAvatar = c ? (c.avatar || '') : '';
    syncAvatarPreview();
    $('#btnDelChar').hidden = !c;
    $('#btnExportChar').hidden = !c;
    show('s-edit');
  }
  function syncAvatarPreview() {
    const p = $('#avatarPreview');
    if (editAvatar) { p.src = editAvatar; p.style.display = ''; } else p.style.display = 'none';
  }
  function saveChar() {
    const name = $('#fName').value.trim();
    if (!name) return toast('至少给角色起个名字');
    const data = { name, tag: $('#fTag').value.trim(), avatar: editAvatar, desc: $('#fDesc').value.trim(), pers: $('#fPers').value.trim(), scene: $('#fScene').value.trim(), greet: $('#fGreet').value.trim(), ex: $('#fEx').value.trim(), sys: $('#fSys').value.trim() };
    if (editingId) Object.assign(chars.find(x => x.id === editingId), data);
    else chars.unshift(Object.assign({ id: uid(), createdAt: Date.now(), alts: [] }, data));
    save(LS.chars, chars); renderLibrary(); toast('已保存'); show('s-lib');
  }

  /* ---------- sheet ---------- */
  function openSheet(title, items) {
    const box = $('#sheet');
    box.innerHTML = '<h3>' + esc(title) + '</h3>';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'greet-item'; if (it.danger) b.style.color = 'var(--danger)';
      b.textContent = it.label; if (it.sub) { const s = document.createElement('small'); s.textContent = it.sub; b.append(s); }
      b.onclick = () => { closeSheet(); it.run(); };
      box.append(b);
    });
    $('#sheetMask').classList.add('on');
  }
  const closeSheet = () => $('#sheetMask').classList.remove('on');

  /* ---------- settings ---------- */
  function renderSettings() {
    $('#cfgBase').value = cfg.base; $('#cfgModel').value = cfg.model; $('#cfgKey').value = cfg.key;
    $('#cfgTemp').value = cfg.temp; $('#cfgTheme').value = theme; $('#cfgAutoMem').value = cfg.autoMem ? '1' : '0';
  }
  async function fetchModels() {
    $('#btnSaveCfg').click();
    toast('正在拉取模型…');
    try {
      const res = await fetch(apiUrl('/models'), { headers: { Authorization: 'Bearer ' + cfg.key } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = (data.data || []).map(m => m.id).filter(Boolean);
      if (!list.length) throw new Error('返回里没有模型');
      const sel = $('#cfgModelSelect');
      sel.innerHTML = list.map(id => '<option value="' + esc(id) + '">' + esc(id) + '</option>').join('');
      sel.style.display = '';
      if (list.includes(cfg.model)) sel.value = cfg.model;
      sel.onchange = () => { $('#cfgModel').value = sel.value; };
      toast('拉到 ' + list.length + ' 个模型，选一个');
    } catch (e) { toast('拉取失败：' + (e.message || e)); }
  }

  /* ---------- 绑定 ---------- */
  $('#btnAdd').onclick = () => openSheet('新建', [
    { label: '现场捏一个角色', sub: '打开编辑器，从零开始', run: () => openEditor(null) },
    { label: '导入角色卡文件', sub: 'JSON / PNG（Tavern · SillyTavern · Chub）', run: () => importCard() }
  ]);
  function importCard() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,.png,application/json,image/png';
    inp.onchange = async () => {
      const f = inp.files?.[0]; if (!f) return;
      try { const card = await cardFromFile(f); chars.unshift(card); save(LS.chars, chars); renderLibrary(); toast('已导入「' + card.name + '」'); }
      catch (e) { toast('导入失败：' + e.message); }
    };
    inp.click();
  }
  $('#btnTheme').onclick = () => { const o = ['midnight', 'sakura', 'noir']; applyTheme(o[(o.indexOf(theme) + 1) % o.length]); toast({ midnight: '午夜紫', sakura: '樱花', noir: '黑金' }[theme]); };
  $('#btnSettings').onclick = () => { renderSettings(); show('s-set'); };
  $('#btnSetBack').onclick = () => show('s-lib');
  $('#btnBack').onclick = () => show('s-lib');
  $('#btnEditBack').onclick = () => show('s-lib');
  $('#send').onclick = send;
  $('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  $('#input').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(132, t.scrollHeight) + 'px'; });
  $('#btnChatMenu').onclick = () => {
    const c = currentChar(); if (!c) return;
    openSheet(c.name, [
      { label: '查看 / 编辑长期记忆', sub: '前情提要', run: () => memorySheet(c.id) },
      { label: '编辑这个角色', run: () => openEditor(c.id) },
      { label: '换个开场白', run: () => {
          const gs = [c.greet, ...(c.alts || [])].filter(Boolean);
          if (gs.length < 2) return toast('这个角色只有一句开场白');
          openSheet('选开场白', gs.map(g => ({ label: g.slice(0, 48) + (g.length > 48 ? '…' : ''), run: () => { chats[c.id] = [{ role: 'assistant', content: g, ts: Date.now() }]; save(LS.chats, chats); renderChat(); } })));
        } },
      { label: '导出对话', run: () => {
          const t = currentChat().map(x => (x.role === 'user' ? '我：' : c.name + '：') + x.content).join('\n\n');
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/plain' })); a.download = c.name + '-对话.txt'; a.click();
        } },
      { label: '清空这段对话', danger: true, run: () => { if (confirm('清空和「' + c.name + '」的全部对话？前情记忆也会清空。')) { delete chats[c.id]; delete mem[c.id]; save(LS.chats, chats); save(LS.mem, mem); openChat(c.id); } } }
    ]);
  };
  $('#avatarFile').onchange = async e => { const f = e.target.files?.[0]; if (!f) return; editAvatar = await downscaleImage(URL.createObjectURL(f), 640); syncAvatarPreview(); toast('头像已就绪，记得保存'); };
  $('#btnSaveChar').onclick = saveChar;
  $('#btnDelChar').onclick = () => {
    if (!editingId) return;
    const c = chars.find(x => x.id === editingId);
    if (!confirm('删除「' + c.name + '」？')) return;
    chars = chars.filter(x => x.id !== editingId); delete chats[editingId]; delete mem[editingId];
    save(LS.chars, chars); save(LS.chats, chats); save(LS.mem, mem); renderLibrary(); show('s-lib');
  };
  $('#btnExportChar').onclick = () => {
    const c = chars.find(x => x.id === editingId); if (!c) return;
    const card = { spec: 'chara_card_v2', spec_version: '2.0', data: { name: c.name, description: c.desc, personality: c.pers, scenario: c.scene, first_mes: c.greet, mes_example: c.ex, system_prompt: c.sys, alternate_greetings: c.alts || [], creator_notes: c.tag } };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(card, null, 2)], { type: 'application/json' })); a.download = c.name + '.json'; a.click();
  };
  $('#btnSaveCfg').onclick = () => {
    cfg = { base: $('#cfgBase').value.trim() || DEFAULT_CFG.base, model: $('#cfgModel').value.trim() || DEFAULT_CFG.model, key: $('#cfgKey').value.trim(), temp: Number($('#cfgTemp').value) || 0.88, autoMem: $('#cfgAutoMem').value === '1' };
    save(LS.cfg, cfg); toast('已保存');
  };
  $('#btnFetchModels').onclick = fetchModels;
  $('#cfgTheme').onchange = e => applyTheme(e.target.value);
  $('#cfgAutoMem').onchange = e => { cfg.autoMem = e.target.value === '1'; save(LS.cfg, cfg); };
  $('#btnTestCfg').onclick = async () => {
    $('#btnSaveCfg').click(); toast('测试中…');
    try { const r = await fetch(apiUrl('/models'), { headers: { Authorization: 'Bearer ' + cfg.key } }); if (!r.ok) throw new Error('HTTP ' + r.status); const d = await r.json(); toast('连接正常（' + ((d.data || []).length) + ' 个模型）'); }
    catch (e) { toast('连接失败：' + (e.message || e)); }
  };
  $('#btnExportAll').onclick = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 5, exportedAt: new Date().toISOString(), chars, chats, mem }, null, 2)], { type: 'application/json' }));
    a.download = 'lumen-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  };
  $('#btnImportAll').onclick = () => $('#importAllFile').click();
  $('#importAllFile').onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (Array.isArray(d.chars)) { chars = d.chars; save(LS.chars, chars); }
      if (d.chats) { chats = d.chats; save(LS.chats, chats); }
      if (d.mem) { mem = d.mem; save(LS.mem, mem); }
      renderLibrary(); toast('导入完成');
    } catch { toast('文件格式不对'); }
  };
  $('#btnRepair').onclick = async () => {
    const before = chars.length;
    chars = chars.filter(c => !looksMojibake(c.name) && !looksMojibake(c.greet || '') && !looksMojibake(c.tag || '') && !looksMojibake(c.desc || ''));
    save(LS.chars, chars);
    await seedExample(true);
    renderLibrary();
    toast(before !== chars.length ? '已清掉乱码角色并重载示例' : '示例角色已重载');
  };
  $('#btnClearAll').onclick = () => {
    if (!confirm('清空这台设备上的全部角色、对话和记忆？不能撤销。')) return;
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    chars = []; chats = {}; mem = {}; renderLibrary(); toast('已清空');
  };
  $('#sheetMask').onclick = e => { if (e.target.id === 'sheetMask') closeSheet(); };

  /* ---------- 首次载入示例角色 ---------- */
  async function seedExample(force) {
    if (chars.length && !force) return;
    try {
      const res = await fetch('cards/dafeiyu.png');
      if (!res.ok) return;
      const blob = await res.blob();
      const card = await cardFromPng(new File([blob], 'dafeiyu.png', { type: 'image/png' }));
      if (!chars.some(c => c.name === card.name)) { chars.push(card); save(LS.chars, chars); renderLibrary(); }
    } catch {}
  }

  migrateLegacy();
  applyTheme(theme);
  renderLibrary();
  renderSettings();
  seedExample();
})();
</script>
</body>
</html>
