<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A9CDCB">
<title>空白</title>
<style>
/* ============================================================
   配色 · 莫兰迪高级灰（取自参考图）
   主色  --c-teal    #6FB4BC   雾青
   辅色  --c-teal-2  #A9CDCB   浅雾青
   米白  --c-cream   #FFF0DE   奶油米
   暖调  --c-warm    #F2DFD3   暖粉砂
   浅褐  --c-sand    #E8D5C4   沙褐
   文字  --ink       #3A5656   深青灰
   ============================================================ */
:root{
  --c-teal:#6FB4BC;
  --c-teal-2:#A9CDCB;
  --c-cream:#FFF0DE;
  --c-warm:#F2DFD3;
  --c-sand:#E8D5C4;
  --ink:#3A5656;
  --ink-soft:#6B8480;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(110% 70% at 12% -10%, #86C0C4 0%, rgba(134,192,196,0) 62%),
    radial-gradient(100% 60% at 100% 32%, rgba(242,223,211,.85) 0%, rgba(242,223,211,0) 60%),
    radial-gradient(120% 80% at 50% 112%, #FFF3E2 0%, rgba(255,243,226,0) 62%),
    linear-gradient(180deg, #A9CDCB 0%, #C3D7D1 20%, #E4E0D4 50%, #F6ECDC 76%, #FFF0DE 100%);
  background-attachment:fixed;
  background-color:#F6ECDC;
}
</style>
</head>
<body>

</body>
