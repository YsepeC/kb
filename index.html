}
.vector-shaft{stroke:url(#thread-light)}
.vector-head{stroke:#72969A;stroke-width:1.2}

.node{
  position:absolute;
  left:calc(50% + var(--x,0px));
  top:calc(50% + var(--y,0px));
  width:var(--ball-size);
  height:var(--ball-size);
  transform:translate(-50%,-50%);
  z-index:2;
}
.node.core{
  width:var(--core-size);
  height:var(--core-size);
  z-index:3;
}
.sphere{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  padding:8px;
  overflow:hidden;
  border:.75px solid rgba(255,255,255,.84);
  border-radius:50%;
  /* Wide diffuse light, thin cool refraction, then a warm rear reflection. */
  background:
    radial-gradient(ellipse at 29% 23%,rgba(255,255,255,.98),rgba(255,255,255,.45) 43%,rgba(255,255,255,0) 68%),
    radial-gradient(ellipse at 81% 82%,rgba(97,138,145,.28),rgba(166,192,187,.09) 41%,transparent 64%),
    radial-gradient(ellipse at 21% 94%,rgba(255,239,218,.82),rgba(255,239,218,0) 58%),
    linear-gradient(138deg,rgba(255,255,251,.83),rgba(236,244,238,.64) 54%,rgba(214,232,226,.62));
  -webkit-backdrop-filter:blur(22px) saturate(.8);
  backdrop-filter:blur(22px) saturate(.8);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.98),
    inset 1px 0 1px rgba(255,255,255,.86),
    inset -1px -2px 3px rgba(68,111,117,.29),
    inset -6px -8px 15px rgba(89,130,135,.13),
    inset 3px 3px 12px rgba(255,255,255,.56),
    3px 9px 15px -9px rgba(47,82,86,.25),
    9px 19px 34px -13px rgba(53,96,100,.19);
  isolation:isolate;
  opacity:0;
}
.sphere::before{
  content:"";
  position:absolute;
  inset:1px;
  padding:1.4px;
  border-radius:inherit;
  background:conic-gradient(from -32deg,rgba(255,255,255,.98),rgba(255,255,255,.20) 21%,rgba(117,163,169,.53) 45%,rgba(255,246,229,.90) 63%,rgba(255,255,255,.26) 77%,rgba(255,255,255,.98));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.sphere::after{
  content:"";
  position:absolute;
  left:14%;
  top:10%;
  width:56%;
  height:27%;
  border-top:1.5px solid rgba(255,255,255,.85);
  border-radius:50%;
  transform:rotate(-29deg);
  background:radial-gradient(ellipse at 43% 24%,rgba(255,255,255,.47),transparent 70%);
  filter:blur(.5px);
  opacity:.75;
  pointer-events:none;
}
.frost{
  position:absolute;
  inset:0;
  border-radius:inherit;
  background-image:var(--film);
  opacity:.105;
  mix-blend-mode:soft-light;
  pointer-events:none;
}
.node .label{
  position:relative;
  z-index:1;
  color:var(--ink);
  font-size:var(--subject-font);
  font-weight:500;
  letter-spacing:.08em;
  line-height:1.35;
  text-shadow:0 1px 1px rgba(255,255,255,.72);
  white-space:nowrap;
  transform:translateY(-1px);
}
.core .core-label{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  font-size:var(--core-font);
  line-height:1.5;
  letter-spacing:.04em;
}
.core-label .name-last{font-size:1.22em;letter-spacing:.08em}
.core .sphere{
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.98),
    inset 1px 0 2px rgba(255,255,255,.90),
    inset -1px -2px 4px rgba(68,111,117,.28),
    inset -7px -9px 18px rgba(89,130,135,.14),
    inset 4px 4px 17px rgba(255,255,255,.67),
    4px 12px 21px -11px rgba(47,82,86,.23),
    10px 23px 40px -13px rgba(53,96,100,.20),
    0 0 43px 2px rgba(255,255,240,.26);
}
.ready .core .sphere{animation:core-pop 830ms cubic-bezier(.22,.70,.28,1) both}
.ready .subject .sphere{
  animation:subject-pop 650ms cubic-bezier(.22,.70,.28,1) both;
  animation-delay:var(--arrival,1590ms);
}
@keyframes core-pop{
  0%{opacity:0;transform:translateY(17px) scale(.12)}
  43%{opacity:1;transform:translateY(-9px) scale(1.07,1.035)}
  70%{opacity:1;transform:translateY(2px) scale(.985,1.018)}
  100%{opacity:1;transform:none}
}
@keyframes subject-pop{
  0%{opacity:0;transform:scale(.10)}
  56%{opacity:1;transform:scale(1.055)}
  79%{opacity:1;transform:scale(.989)}
  100%{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  .glass-sweep{animation:none}
  .ready .sphere{opacity:1;animation:none !important;transform:none}
}
</style>
</head>
<body>
<main class="entry" aria-label="词神的脑瓜">
  <div class="ambient" aria-hidden="true">
    <svg class="glass-sweep" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="ribbon-material" x1="0" y1="0" x2="1" y2=".6">
          <stop offset="0" stop-color="#EFFFF8" stop-opacity=".16"/>
          <stop offset=".24" stop-color="#FDFFF8" stop-opacity=".48"/>
          <stop offset=".46" stop-color="#75A8AD" stop-opacity=".13"/>
          <stop offset=".54" stop-color="#FFFFFF" stop-opacity=".70"/>
          <stop offset=".72" stop-color="#C3DDD4" stop-opacity=".18"/>
          <stop offset="1" stop-color="#FFFAEB" stop-opacity=".49"/>
        </linearGradient>
        <linearGradient id="rim-light" x1="0" y1="0" x2=".4" y2="1">
          <stop stop-color="#FFFFFF" stop-opacity=".90"/>
          <stop offset=".41" stop-color="#F1FFF7" stop-opacity=".31"/>
          <stop offset=".58" stop-color="#7FAFB0" stop-opacity=".24"/>
          <stop offset="1" stop-color="#FFF7E9" stop-opacity=".90"/>
        </linearGradient>
        <filter id="ribbon-shadow" x="-50%" y="-40%" width="200%" height="180%">
          <feGaussianBlur stdDeviation="21"/>
        </filter>
        <filter id="light-soften" x="-50%" y="-20%" width="200%" height="140%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>
      <path d="M 282 -130 C 162 87 94 376 213 582 C 292 721 450 789 480 952 C 515 1141 407 1347 235 1619 L 387 1715 C 613 1334 658 1137 569 893 C 512 736 377 661 320 548 C 221 351 283 126 394 -67 Z" fill="#3F747D" opacity=".10" filter="url(#ribbon-shadow)" transform="translate(27 38)"/>
      <path d="M 282 -130 C 162 87 94 376 213 582 C 292 721 450 789 480 952 C 515 1141 407 1347 235 1619 L 387 1715 C 613 1334 658 1137 569 893 C 512 736 377 661 320 548 C 221 351 283 126 394 -67 Z" fill="url(#ribbon-material)"/>
      <path d="M 282 -130 C 162 87 94 376 213 582 C 292 721 450 789 480 952 C 515 1141 407 1347 235 1619" stroke="url(#rim-light)" stroke-width="2.4" fill="none"/>
      <path d="M 394 -67 C 283 126 221 351 320 548 C 377 661 512 736 569 893 C 658 1137 613 1334 387 1715" stroke="url(#rim-light)" stroke-width="1.3" fill="none" opacity=".62"/>
      <path d="M 314 -92 C 207 147 164 359 268 557 C 331 677 474 787 508 944 C 555 1171 449 1389 307 1660" stroke="#FCFFF5" stroke-width="17" fill="none" filter="url(#light-soften)" opacity=".22"/>
      <path d="M 337 1590 C 588 1321 939 1371 1093 1200" stroke="#FFFEF2" stroke-width="4" fill="none" filter="url(#light-soften)" opacity=".52"/>
    </svg>
  </div>
  <div class="constellation" id="constellation">
    <svg class="vectors" id="vectors" aria-hidden="true"></svg>
    <div class="node core"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label core-label"><span>词神的</span><span class="name-last">脑瓜</span></span></div></div>
    <div class="node subject" data-angle="-90"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">语文</span></div></div>
    <div class="node subject" data-angle="-30"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">数学</span></div></div>
    <div class="node subject" data-angle="30"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">英语</span></div></div>
    <div class="node subject" data-angle="90"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">物理</span></div></div>
    <div class="node subject" data-angle="150"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">化学</span></div></div>
    <div class="node subject" data-angle="210"><div class="sphere"><i class="frost" aria-hidden="true"></i><span class="label">生物</span></div></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const scene = document.getElementById('constellation');
  const svg = document.getElementById('vectors');
  const subjects = Array.from(scene.querySelectorAll('.subject'));
  const ns = 'http://www.w3.org/2000/svg';
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let lastWidth = 0, lastHeight = 0;

  function element(tag,attributes){
    const el = document.createElementNS(ns,tag);
    Object.entries(attributes).forEach(([key,value]) => el.setAttribute(key,String(value)));
    return el;
  }
  function point(cx,cy,r,angle){
    const rad = angle * Math.PI / 180;
    return [cx + Math.cos(rad) * r,cy + Math.sin(rad) * r];
  }
  function layout(enter){
    svg.getAnimations({subtree:true}).forEach(animation => animation.cancel());
    const width = scene.clientWidth, height = scene.clientHeight;
    lastWidth = width;
    lastHeight = height;
    const diameter = Math.min(103,width * .209);
    const coreSize = diameter * 1.22;
    const radius = Math.min(207,(width / 2 - diameter / 2 - 13) / .8660254,height / 2 - diameter / 2 - 15);
    const tip = Math.max(0,radius - diameter / 2 - 6);
    const gap = radius - tip;
    scene.style.setProperty('--ball-size',diameter + 'px');
    scene.style.setProperty('--core-size',coreSize + 'px');
    scene.style.setProperty('--core-font',Math.min(21,coreSize * .19) + 'px');
    scene.style.setProperty('--subject-font',Math.min(25,diameter * .276) + 'px');
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.replaceChildren();

    const defs = element('defs',{});
    const gradient = element('linearGradient',{id:'thread-light',gradientUnits:'userSpaceOnUse',x1:0,y1:0,x2:radius,y2:0});
    [[0,'#547475',.20],[.47,'#698F91',.61],[1,'#A1B9B6',.92]].forEach(([offset,color,opacity]) => gradient.appendChild(element('stop',{offset,'stop-color':color,'stop-opacity':opacity})));
    defs.appendChild(gradient);
    svg.appendChild(defs);

    subjects.forEach((node,index) => {
      const angle = Number(node.dataset.angle);
      const radians = angle * Math.PI / 180;
      node.style.setProperty('--x',Math.cos(radians) * radius + 'px');
      node.style.setProperty('--y',Math.sin(radians) * radius + 'px');
      const delay = 920 + index * 35;
      node.style.setProperty('--arrival',delay + 660 + 'ms');
      const group = element('g',{transform:`translate(${width / 2} ${height / 2}) rotate(${angle})`});
      const shaft = element('line',{class:'vector vector-shaft',x1:0,y1:0,x2:radius,y2:0});
      shaft.style.strokeDasharray = String(radius);
      shaft.style.strokeDashoffset = String(gap);
      const head = element('path',{class:'vector vector-head',d:'M -7 -3.6 L 0 0 L -7 3.6'});
      head.style.transform = `translateX(${tip}px)`;
      group.append(shaft,head);
      svg.appendChild(group);
      if(enter && !motion.matches){
        const options = {duration:880,delay,easing:'linear',fill:'both'};
        shaft.animate([
          {strokeDashoffset:String(radius),opacity:0,offset:0,easing:'cubic-bezier(.26,.46,.35,1)'},
          {strokeDashoffset:'0',opacity:1,offset:.75,easing:'ease-out'},
          {strokeDashoffset:String(gap),opacity:1,offset:1}
        ],options);
        head.animate([
          {transform:'translateX(0px)',opacity:0,offset:0,easing:'cubic-bezier(.26,.46,.35,1)'},
          {transform:`translateX(${radius}px)`,opacity:1,offset:.75,easing:'ease-out'},
          {transform:`translateX(${tip}px)`,opacity:1,offset:1}
        ],options);
      }
    });
    scene.classList.add('ready');
  }
  // Font data is embedded; no font request is made during the entrance.
  if(document.fonts){document.fonts.load('500 20px "Brain Serif"').catch(() => {});}
  layout(true);
  const resize = () => {
    if(Math.abs(scene.clientWidth - lastWidth) > 1 || Math.abs(scene.clientHeight - lastHeight) > 1){layout(false);}
  };
  if('ResizeObserver' in window){new ResizeObserver(resize).observe(scene);}
  else{window.addEventListener('resize',resize);}
  motion.addEventListener('change',() => layout(false));
})();
</script>
</body>
</html>
