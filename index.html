<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Lumen · 聊天与记忆</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --text:#e6edf3; --muted:#8b949e; --accent:#4f9cf9; --accent2:#7ee787;
    --warn:#f0883e; --danger:#f85149; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;
  }
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  header .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);margin-left:2px}
  nav{margin-left:auto;display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--line)}
  nav button{
    border:0;background:transparent;color:var(--muted);font-size:13px;padding:5px 11px;border-radius:8px;cursor:pointer;
  }
  nav button.on{background:var(--panel2);color:var(--text)}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  section{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}
  section.on{display:flex}

  /* chat */
  #msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:88%;padding:9px 12px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-word;position:relative}
  .msg.user{align-self:flex-end;background:#1f3a5f;border:1px solid #2b4c78}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.err{align-self:stretch;background:#2d1618;border:1px solid #5c2626;color:#ffb4b0;font-size:13px}
  .msg .acts{display:flex;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
  .msg .acts button{border:0;background:transparent;color:var(--muted);padding:0;font-size:12px;cursor:pointer}
  .msg .acts button:active{color:var(--accent)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:34px 20px;line-height:1.9}
  #composer{
    border-top:1px solid var(--line);background:var(--panel);padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end;
  }
  #input{
    flex:1;resize:none;max-height:120px;min-height:40px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;outline:none;
  }
  #input:focus{border-color:var(--accent)}
  #send{
    background:var(--accent);color:#08111f;border:0;border-radius:12px;padding:0 16px;height:40px;
    font-weight:600;font-size:14px;cursor:pointer;flex:0 0 auto;
  }
  #send:disabled{opacity:.45;cursor:default}
  .hint{font-size:11px;color:var(--muted);padding:0 14px 8px}

  /* generic panels */
  .scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h2{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .row{display:flex;gap:8px}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;
    padding:8px 12px;font-size:13px;cursor:pointer;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#08111f;font-weight:600}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger);border-color:#3b2225}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--muted)}
  .field input,.field select{
    background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:9px 11px;font:inherit;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .facts{display:flex;flex-direction:column;gap:8px}
  .fact{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .fact p{margin:0;flex:1;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
  .fact .x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
  .fact .meta{font-size:11px;color:var(--muted);margin-top:4px}
  textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font:inherit;outline:none;min-height:140px;resize:vertical}
  .toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
    background:#22303f;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.18s;z-index:20;max-width:86vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
  .kv b{color:var(--text);font-weight:500}
</style>
</head>
<body>
<header>
  <h1>Lumen</h1><span class="dot"></span>
  <nav>
    <button data-view="chat" class="on">聊天</button>
    <button data-view="memory">记忆</button>
    <button data-view="settings">设置</button>
  </nav>
</header>

<main>
  <section id="view-chat" class="on">
    <div id="msgs"></div>
    <div class="hint" id="chatHint">带记忆的对话：每次发送前会自动附上你的档案和事实库。</div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">发送</button>
    </div>
  </section>

  <section id="view-memory">
    <div class="scroll">
      <div class="card">
        <h2>事实库 <span id="factCount" style="color:var(--muted)"></span></h2>
        <div class="facts" id="facts"></div>
        <div class="row" style="margin-top:10px">
          <input id="newFact" placeholder="记一条新事实，比如：用户喜欢喝冰美式" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 11px;font:inherit;outline:none">
          <button class="btn primary" id="addFact">加</button>
        </div>
      </div>
      <div class="card">
        <h2>用户档案</h2>
        <textarea id="profile" placeholder="长期有效的偏好、忌讳、习惯…"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="saveProfile">保存档案</button></div>
      </div>
      <div class="card">
        <h2>最近事件 <span id="journalCount" style="color:var(--muted)"></span></h2>
        <div id="journal" style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto"></div>
      </div>
      <div class="card">
        <h2>备份与迁移</h2>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn" id="exportJson">导出全部 JSON</button>
          <button class="btn" id="exportMd">导出事实 .md</button>
          <button class="btn ghost" id="importBtn">导入 JSON</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">
          导出后可以直接提交到仓库的 <code>memory/</code> 目录，换设备、换模型都能继续用。
        </p>
      </div>
    </div>
  </section>

  <section id="view-settings">
    <div class="scroll">
      <div class="card">
        <h2>模型接口</h2>
        <div class="field"><label>Base URL</label><input id="cfgBase" placeholder="https://api.deepseek.com"></div>
        <div class="field"><label>模型</label><input id="cfgModel" placeholder="deepseek-chat"></div>
        <div class="field"><label>API Key（只存在这台设备的浏览器里）</label><input id="cfgKey" type="password" placeholder="sk-…" autocomplete="off"></div>
        <div class="field"><label>温度</label><input id="cfgTemp" type="number" step="0.1" min="0" max="2"></div>
        <div class="row" style="flex-wrap:wrap">
          <button class="btn primary" id="saveCfg">保存</button>
          <button class="btn" id="testCfg">测试连接</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:10px 0 0">
          接口需要允许浏览器跨域（DeepSeek 已允许）。Key 不会上传到任何服务器，也不会写进这个仓库。
        </p>
      </div>
      <div class="card">
        <h2>行为</h2>
        <div class="kv"><span>自动从回复里提取记忆</span><b id="autoMemLabel">关</b></div>
        <div class="row" style="margin-top:8px"><button class="btn" id="toggleAutoMem">切换</button></div>
      </div>
      <div class="card">
        <h2>数据</h2>
        <div class="kv"><span>事实</span><b id="statFacts">0</b></div>
        <div class="kv"><span>事件</span><b id="statJournal">0</b></div>
        <div class="kv"><span>消息</span><b id="statChat">0</b></div>
        <div class="row" style="margin-top:10px"><button class="btn danger" id="clearAll">清空全部数据</button></div>
      </div>
      <p style="font-size:12px;color:var(--muted)">Lumen 是一个纯静态单页应用：数据存在浏览器 localStorage，记忆随对话一起发给模型。<br>仓库里 <code>memory/facts.md</code> 和 <code>memory/profile.md</code> 是种子记忆，首次打开会自动导入。</p>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const K = {
    cfg: 'lumen.cfg.v1', facts: 'lumen.facts.v1', profile: 'lumen.profile.v1',
    journal: 'lumen.journal.v1', chat: 'lumen.chat.v1', seeded: 'lumen.seeded.v1',
    autoMem: 'lumen.automem.v1'
  };
  const DEFAULTS = { base: 'https://api.deepseek.com', model: 'deepseek-chat', key: '', temp: 0.7 };
  const SYS = '你是「大肥鱼」，一个住在用户手机里的 AI 伙伴：说话直接、有信息量、偶尔可爱，不端着机器腔。回答用简体中文。你会收到用户档案和事实库，把它们当作已知信息，不要复述成条目，自然地用。';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let cfg = Object.assign({}, DEFAULTS, load(K.cfg, {}));
  let facts = load(K.facts, []);          // [{id,text,ts}]
  let profile = load(K.profile, '');
  let journal = load(K.journal, []);      // [{ts,role,text}]
  let chat = load(K.chat, []);            // [{role,content,ts}]
  let autoMem = load(K.autoMem, false);
  let busy = false;

  /* ---------------- toast ---------------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1900);
  }

  /* ---------------- tabs ---------------- */
  $$('nav button').forEach(b => b.addEventListener('click', () => {
    $$('nav button').forEach(x => x.classList.toggle('on', x === b));
    $$('main section').forEach(s => s.classList.toggle('on', s.id === 'view-' + b.dataset.view));
  }));

  /* ---------------- markdown-lite ---------------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function md(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  /* ---------------- chat render ---------------- */
  function renderChat() {
    const box = $('#msgs');
    if (!chat.length) {
      box.innerHTML = '<div class="empty">还没有对话。<br>先去「设置」填 API Key，然后随便说一句。<br>我和记忆库是连着的——你在「记忆」里写下的东西，我下次就记得。</div>';
      return;
    }
    box.innerHTML = '';
    chat.forEach((m, i) => {
      const el = document.createElement('div');
      el.className = 'msg ' + (m.role === 'user' ? 'user' : m.role === 'error' ? 'err' : 'bot');
      el.innerHTML = md(m.content || '');
      if (m.role === 'assistant') {
        const acts = document.createElement('div');
        acts.className = 'acts';
        const b1 = document.createElement('button'); b1.textContent = '记住这条'; b1.onclick = () => extractMemory(m.content);
        const b2 = document.createElement('button'); b2.textContent = '复制'; b2.onclick = () => { navigator.clipboard?.writeText(m.content || '').then(() => toast('已复制'), () => toast('复制失败')); };
        acts.append(b1, b2);
        el.append(acts);
      }
      box.append(el);
    });
    box.scrollTop = box.scrollHeight;
  }

  function pushChat(role, content, persist = true) {
    chat.push({ role, content, ts: Date.now() });
    if (persist) { save(K.chat, chat); }
    renderChat();
  }

  /* ---------------- memory render ---------------- */
  function renderFacts() {
    const box = $('#facts');
    $('#factCount').textContent = facts.length ? '(' + facts.length + ')' : '';
    if (!facts.length) { box.innerHTML = '<p style="color:var(--muted);font-size:13px;margin:0">还没有事实。对话里点「记住这条」，或者下面手动加。</p>'; return; }
    box.innerHTML = '';
    facts.slice().reverse().forEach(f => {
      const el = document.createElement('div');
      el.className = 'fact';
      const p = document.createElement('div'); p.style.flex = '1';
      p.innerHTML = md(f.text) + '<div class="meta">' + (f.ts ? new Date(f.ts).toLocaleString('zh-CN') : '') + '</div>';
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
      x.onclick = () => { facts = facts.filter(y => y.id !== f.id); save(K.facts, facts); renderFacts(); stat(); };
      el.append(p, x);
      box.append(el);
    });
  }

  function renderJournal() {
    const box = $('#journal');
    $('#journalCount').textContent = journal.length ? '(' + journal.length + ')' : '';
    if (!journal.length) { box.innerHTML = '<p style="color:var(--muted);font-size:13px;margin:0">聊天会自动记下最近发生的事。</p>'; return; }
    box.innerHTML = '';
    journal.slice(-30).reverse().forEach(j => {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px';
      d.innerHTML = '<span style="color:var(--text)">' + new Date(j.ts).toLocaleString('zh-CN') + '</span> · ' + esc(j.role) + '<br>' + esc((j.text || '').slice(0, 120));
      box.append(d);
    });
  }

  function stat() {
    $('#statFacts').textContent = facts.length;
    $('#statJournal').textContent = journal.length;
    $('#statChat').textContent = chat.length;
  }

  function renderProfile() { $('#profile').value = profile; }
  function renderAutoMem() { $('#autoMemLabel').textContent = autoMem ? '开' : '关'; }

  /* ---------------- memory write ---------------- */
  function addFact(text, ts) {
    const t = String(text || '').trim();
    if (!t) return false;
    if (facts.some(f => f.text === t)) return false;
    facts.push({ id: 'f' + Date.now() + Math.random().toString(36).slice(2, 6), text: t, ts: ts || Date.now() });
    save(K.facts, facts);
    renderFacts(); stat();
    return true;
  }

  function addJournal(role, text) {
    if (!text) return;
    journal.push({ ts: Date.now(), role, text: String(text).slice(0, 500) });
    if (journal.length > 400) journal = journal.slice(-400);
    save(K.journal, journal);
    renderJournal(); stat();
  }

  async function extractMemory(text) {
    if (!text) return;
    if (!cfg.key) { addFact(text.slice(0, 300)); toast('已原样存进事实库（没配模型，没做提炼）'); return; }
    toast('正在提炼记忆…');
    try {
      const r = await callModel([
        { role: 'system', content: '你是一个记忆提炼器。从给定的对话片段中提炼出值得长期记住的事实，每条一句话、简体中文、不超过 40 字。只输出 JSON 数组，例如 ["用户叫小林","用户 1000 米跑 3 分整"]。没有值得记的就输出 []。' },
        { role: 'user', content: text.slice(0, 4000) }
      ], { stream: false, maxTokens: 400, temp: 0.2 });
      let arr = [];
      try { arr = JSON.parse((r.match(/\[[\s\S]*\]/) || ['[]'])[0]); } catch { arr = []; }
      let n = 0;
      for (const it of arr) if (typeof it === 'string' && addFact(it)) n++;
      toast(n ? '记住了 ' + n + ' 条' : '这条里没提炼出新事实');
    } catch (e) {
      addFact(text.slice(0, 300));
      toast('提炼失败，已原样存入');
    }
  }

  /* ---------------- model call ---------------- */
  function apiUrl(path) {
    const base = (cfg.base || DEFAULTS.base).replace(/\/+$/, '');
    return base + path;
  }

  async function callModel(messages, opts = {}) {
    if (!cfg.key) throw new Error('还没填 API Key，去「设置」里填一个。');
    const body = {
      model: cfg.model || DEFAULTS.model,
      messages,
      temperature: opts.temp ?? cfg.temp ?? 0.7,
      max_tokens: opts.maxTokens ?? 1200,
      stream: !!opts.stream
    };
    const res = await fetch(apiUrl('/chat/completions'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 300); } catch {}
      throw new Error('接口返回 ' + res.status + (detail ? '：' + detail : ''));
    }
    if (!opts.stream) {
      const data = await res.json();
      return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    }
    return res;
  }

  function buildSystem() {
    const parts = [SYS];
    if (profile.trim()) parts.push('## 用户档案\n' + profile.trim());
    if (facts.length) parts.push('## 事实库\n' + facts.slice(-80).map(f => '- ' + f.text).join('\n'));
    if (journal.length) parts.push('## 最近发生的事\n' + journal.slice(-8).map(j => '- ' + (j.role === 'user' ? '用户说：' : '我说：') + String(j.text).slice(0, 80)).join('\n'));
    return parts.join('\n\n');
  }

  async function send() {
    const input = $('#input');
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = ''; input.style.height = 'auto';
    pushChat('user', text);
    addJournal('user', text);
    busy = true; $('#send').disabled = true;

    const history = chat.filter(m => m.role === 'user' || m.role === 'assistant').slice(-12)
      .map(m => ({ role: m.role, content: m.content }));
    const messages = [{ role: 'system', content: buildSystem() }, ...history];

    const bubble = document.createElement('div');
    bubble.className = 'msg bot';
    bubble.textContent = '…';
    $('#msgs').append(bubble);
    $('#msgs').scrollTop = $('#msgs').scrollHeight;

    let acc = '';
    try {
      const res = await callModel(messages, { stream: true });
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          const s = line.trim();
          if (!s.startsWith('data:')) continue;
          const payload = s.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const j = JSON.parse(payload);
            const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) { acc += delta; bubble.innerHTML = md(acc); $('#msgs').scrollTop = $('#msgs').scrollHeight; }
          } catch {}
        }
      }
      if (!acc) acc = '（模型没有返回内容）';
      bubble.remove();
      pushChat('assistant', acc);
      addJournal('assistant', acc);
      if (autoMem && acc.length > 20) extractMemory(acc);
    } catch (e) {
      bubble.remove();
      pushChat('error', '出错了：' + (e && e.message ? e.message : String(e)) + '\n\n常见原因：API Key 不对、余额不足、或网络跨域被拦。');
    } finally {
      busy = false; $('#send').disabled = false;
    }
  }

  /* ---------------- bindings ---------------- */
  $('#send').onclick = send;
  $('#input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $('#input').addEventListener('input', e => {
    const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px';
  });

  $('#addFact').onclick = () => {
    const el = $('#newFact');
    if (addFact(el.value)) { el.value = ''; toast('已加入事实库'); } else toast('没写内容或已存在');
  };
  $('#newFact').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#addFact').click(); } });

  $('#saveProfile').onclick = () => { profile = $('#profile').value; save(K.profile, profile); toast('档案已保存'); };

  $('#exportJson').onclick = () => {
    const data = { version: 1, exportedAt: new Date().toISOString(), facts, profile, journal, chat };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lumen-memory-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出');
  };

  $('#exportMd').onclick = () => {
    const mdText = '# 事实\n\n' + facts.map(f => '- ' + f.text).join('\n') + '\n\n# 用户档案\n\n' + (profile || '') + '\n';
    const blob = new Blob([mdText], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'facts.md';
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出 facts.md');
  };

  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (Array.isArray(data.facts)) { facts = data.facts; save(K.facts, facts); }
      if (typeof data.profile === 'string') { profile = data.profile; save(K.profile, profile); }
      if (Array.isArray(data.journal)) { journal = data.journal; save(K.journal, journal); }
      if (Array.isArray(data.chat)) { chat = data.chat; save(K.chat, chat); }
      renderAll(); toast('导入完成');
    } catch (err) { toast('文件格式不对'); }
  };

  $('#saveCfg').onclick = () => {
    cfg = {
      base: $('#cfgBase').value.trim() || DEFAULTS.base,
      model: $('#cfgModel').value.trim() || DEFAULTS.model,
      key: $('#cfgKey').value.trim(),
      temp: Number($('#cfgTemp').value) || 0.7
    };
    save(K.cfg, cfg);
    toast('已保存');
  };

  $('#testCfg').onclick = async () => {
    $('#saveCfg').click();
    toast('测试中…');
    try {
      const res = await fetch(apiUrl('/models'), { headers: { Authorization: 'Bearer ' + cfg.key } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const n = (data.data || []).length;
      toast('连接正常，可用模型 ' + n + ' 个');
    } catch (e) { pushChat('error', '连接失败：' + (e.message || e) + '\n（有些接口不支持 /models，可以直接发一条消息试试）'); }
  };

  $('#toggleAutoMem').onclick = () => { autoMem = !autoMem; save(K.autoMem, autoMem); renderAutoMem(); };

  $('#clearAll').onclick = () => {
    if (!confirm('清空这台设备上的全部事实、事件和聊天记录？这个操作不能撤销。')) return;
    [K.chat, K.journal, K.facts, K.profile].forEach(k => localStorage.removeItem(k));
    chat = []; journal = []; facts = []; profile = '';
    renderAll(); toast('已清空');
  };

  /* ---------------- seed from repo ---------------- */
  async function seed() {
    if (load(K.seeded, false)) return;
    try {
      const [f, p] = await Promise.all([
        fetch('memory/facts.md').then(r => r.ok ? r.text() : ''),
        fetch('memory/profile.md').then(r => r.ok ? r.text() : '')
      ]);
      const bullets = f.split('\n').filter(l => /^\s*[-*]\s+/.test(l)).map(l => l.replace(/^\s*[-*]\s+/, '').trim()).filter(Boolean);
      if (!facts.length) { bullets.forEach(t => facts.push({ id: 'seed' + Math.random().toString(36).slice(2, 8), text: t, ts: Date.now() })); save(K.facts, facts); }
      if (!profile && p) { profile = p.replace(/^#.*$/gm, '').trim(); save(K.profile, profile); }
      save(K.seeded, true);
      renderAll();
    } catch {}
  }

  function renderAll() {
    renderChat(); renderFacts(); renderJournal(); renderProfile(); renderAutoMem(); stat();
    $('#cfgBase').value = cfg.base; $('#cfgModel').value = cfg.model; $('#cfgKey').value = cfg.key; $('#cfgTemp').value = cfg.temp;
  }

  renderAll();
  seed();
})();
</script>
</body>
</html>
