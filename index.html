:root{--page:#F3F6FC;--surface:#FFFFFF;--soft-surface:#EAF0F9;--ink:#1D2F50;--muted:#516585;--line:#CED8E9;--accent:#163C87;--accent-ink:#FFFFFF;--selected:#DAE6FC;--stage:#163C87;--stage-deep:#102A64;--stage-edge:#6986BF;--stage-line:#AAC0E4;--orb-light:#FFFFFF;--orb-middle:#EAF0FA;--orb-dark:#A8BDD8;--ink-rgb:29,47,80;--border-focus:#285CAA;--reading:#FBFCFF;--c-teal:#6FB4BC;--c-teal-2:#A9CDCB;--c-cream:#FFF0DE;--c-frost:#E4ECE7;--c-reflection:#547475}
html[data-theme="night"]{--page:#152647;--surface:#1F3559;--soft-surface:#253C62;--ink:#EFF4FE;--muted:#B9CBE5;--line:#435D83;--accent:#A8C4F4;--accent-ink:#142644;--selected:#354E77;--stage:#2C4C7D;--stage-deep:#203A61;--stage-edge:#7899C6;--stage-line:#B8CCE9;--orb-light:#FFFFFF;--orb-middle:#DCE7F8;--orb-dark:#8AA7CF;--ink-rgb:239,244,254;--border-focus:#B6D0FB;--reading:#1C3050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%;width:100%}
html{background:var(--page);color:var(--ink);color-scheme:light}
html[data-theme="night"]{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
::selection{background:var(--selected);color:var(--ink)}
button,a,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:wait}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--border-focus);outline-offset:5px}
.entry{position:relative;min-height:100dvh;max-width:1540px;margin:auto;overflow:hidden;padding:0 56px;isolation:isolate}
.home-header{height:105px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;letter-spacing:.04em}
.brand svg{width:30px;height:30px;flex:none}
.theme-switch{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:100px;font-size:12px;min-height:40px}
.theme-switch svg{width:17px;height:17px}
.theme-switch:hover{background:var(--soft-surface);color:var(--ink)}
.home-layout{min-height:calc(100dvh - 173px);display:grid;grid-template-columns:minmax(250px,.78fr) minmax(500px,1.3fr);align-items:center;gap:36px;padding:22px 0 28px}
.home-copy{position:relative;z-index:2;padding:16px 0}
.home-copy h1{font-family:"Brain Display",sans-serif;font-size:clamp(60px,6.5vw,96px);font-weight:700;line-height:1.13;letter-spacing:-.035em;margin:0 0 25px;color:var(--ink)}
.title-period{color:var(--accent);font-family:inherit}
.home-description{font-size:22px;letter-spacing:.045em;margin:0 0 21px;line-height:1.7;font-weight:500}
.home-instruction{font-size:14px;line-height:1.85;color:var(--muted);margin:0;max-width:290px}
.resume-study{display:flex;align-items:center;gap:12px;padding:11px 0;background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);margin-top:24px;text-align:left;font-size:12px}
.resume-study strong{font-weight:600}.resume-study svg{width:18px;height:18px}
.orbital-stage{position:relative;min-width:0;width:100%;height:min(630px,calc(100dvh - 225px));min-height:410px;border-radius:43% 43% 43% 16%;isolation:isolate}
.stage-field{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;border-radius:inherit;background:radial-gradient(ellipse at 24% 10%,rgba(147,179,220,.18),transparent 59%),linear-gradient(145deg,var(--stage),var(--stage-deep));box-shadow:18px 28px 52px -31px rgba(16,40,90,.28)}
.field-disc{position:absolute;width:76%;height:76%;left:12%;top:8%;border:1px solid rgba(204,223,248,.16);border-radius:50%;background:radial-gradient(ellipse at 33% 20%,rgba(204,223,248,.14),rgba(204,223,248,0) 65%);transform:rotate(-27deg) scaleY(.73)}
.field-ring{position:absolute;left:-22%;top:22%;width:145%;height:60%;border:1px solid rgba(215,232,255,.25);border-radius:50%;transform:rotate(-32deg);box-shadow:inset 0 1px 0 rgba(210,229,255,.04)}
.ring-two{left:-8%;top:23%;width:110%;height:48%;transform:rotate(39deg);border-color:rgba(180,207,244,.12)}
.field-shadow{position:absolute;left:25%;bottom:6%;width:50%;height:5%;background:rgba(8,27,64,.31);filter:blur(17px);border-radius:50%}
.constellation{position:absolute;left:50%;top:48%;width:min(calc(100% - 36px),520px);aspect-ratio:1;transform:translate(-50%,-50%);--ball-size:85px;--core-size:105px;--subject-font:21px;--core-font:12px}
.vectors{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}
.vector{fill:none;stroke:var(--stage-line);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.node{position:absolute;left:calc(50% + var(--x,0px));top:calc(50% + var(--y,0px));width:var(--ball-size);height:var(--ball-size);transform:translate(-50%,-50%);z-index:2}
.node.core{width:var(--core-size);height:var(--core-size);z-index:3}
.subject.node{appearance:none;background:transparent;border:0;padding:0;border-radius:50%;touch-action:manipulation;color:var(--ink)}
.subject.node:focus-visible{outline:2px solid #E1ECFF;outline-offset:7px}
.sphere{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;width:100%;height:100%;border-radius:50%;isolation:isolate;color:#1D3B66;background:radial-gradient(ellipse at 29% 23%,var(--orb-light) 0%,var(--orb-middle) 45%,var(--orb-dark) 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.85),inset -2px -4px 9px rgba(74,113,168,.25),6px 16px 18px -12px rgba(7,27,61,.68),13px 24px 32px -15px rgba(7,27,61,.28);transition:box-shadow .28s,translate .28s}
.sphere::before{content:"";position:absolute;inset:2px;border-radius:inherit;border-top:1px solid rgba(255,255,255,.86);border-left:1px solid rgba(255,255,255,.59);border-bottom:1px solid rgba(166,193,228,.58);pointer-events:none}
.sphere::after{content:"";position:absolute;left:20%;top:12%;width:52%;height:20%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.64),transparent 76%);filter:blur(3px);pointer-events:none}
.subject .label{font-family:"Brain Display",sans-serif;font-weight:700;font-size:var(--subject-font);letter-spacing:.075em;color:#234470;position:relative;z-index:1}
.subject:hover .sphere,.subject:focus-visible .sphere{translate:0 -5px;box-shadow:inset 0 2px 3px rgba(255,255,255,.95),inset -2px -4px 9px rgba(74,113,168,.22),8px 20px 25px -10px rgba(7,27,61,.58)}
.subject:active .sphere{translate:0 0;scale:.96}
.core .sphere{background:radial-gradient(ellipse at 23% 18%,#4F72AA 0%,#284F8C 47%,#102E66 100%);box-shadow:inset 0 1px 2px rgba(174,204,247,.55),inset -3px -8px 13px rgba(6,25,58,.40),6px 15px 25px -9px rgba(5,20,53,.55);color:#DBE7FF}
.core-mark{display:block;width:43%;height:43%;color:#E7F0FE;margin-bottom:6px}.core-mark svg{width:100%;height:100%}.core-label{font-size:var(--core-font);font-weight:500;letter-spacing:.04em;color:#DDE9FF}
.replay-home{position:absolute;bottom:18px;right:24px;display:flex;align-items:center;gap:7px;padding:7px 9px;background:transparent;border:0;color:#D4E1F8;font-size:10px}.replay-home svg{width:15px;height:15px}
.home-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:68px;color:var(--muted);border-top:1px solid var(--line);font-size:11px;letter-spacing:.035em;line-height:1.7}.home-footer p{margin:0}.home-footer p span{opacity:.45;margin:0 7px}.footer-detail{white-space:nowrap}
@media(max-width:1000px){.entry{padding:0 30px}.home-layout{gap:18px;grid-template-columns:minmax(220px,.8fr) minmax(380px,1.1fr)}.home-copy h1{font-size:70px}.orbital-stage{height:535px;min-height:450px}}
@media(max-width:700px){.entry{padding:0 22px}.home-header{height:76px}.brand{font-size:12px}.brand svg{width:25px;height:25px}.theme-switch{font-size:11px;padding:7px 10px;min-height:35px}.home-layout{display:flex;flex-direction:column;gap:18px;min-height:0;padding:24px 0 22px;align-items:stretch}.home-copy{display:grid;grid-template-columns:1fr auto;column-gap:14px;padding:0;align-items:end}.home-copy h1{font-size:clamp(47px,13.5vw,69px);line-height:1.11;margin:0;grid-row:1/3}.home-description{font-size:14px;margin:0 0 8px;text-align:right;white-space:nowrap}.home-instruction{font-size:11px;line-height:1.7;text-align:right;max-width:145px}.desktop-break{display:none}.resume-study{grid-column:1/-1;justify-content:flex-start;margin-top:12px;padding:7px 0;width:max-content;font-size:11px}.orbital-stage{height:auto;min-height:0;aspect-ratio:1/1.06;max-width:480px;margin:0 auto;border-radius:43% 43% 43% 14%}.constellation{top:47%;width:calc(100% - 32px)}.replay-home{bottom:12px;right:15px}.home-footer{font-size:10px;min-height:56px}.footer-detail{display:none}.home-footer p span{margin:0 3px}.core-label{letter-spacing:0}.field-shadow{bottom:5%}}
@media(max-width:360px){.entry{padding:0 15px}.home-instruction{font-size:10px;max-width:130px}.home-layout{gap:17px}.home-copy h1{font-size:45px}.home-description{font-size:12px}.constellation{width:calc(100% - 28px)}}
@media(prefers-reduced-motion:reduce){.sphere{transition:none}}
@media(prefers-reduced-transparency:reduce){.theme-switch{background:var(--surface)}}
.resource-entry{display:inline-flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--muted);font-size:11px;padding:7px 0}.resource-entry svg{width:16px;height:16px}.resource-entry:hover{color:var(--ink)}
@media(max-width:700px){.resource-entry{font-size:10px}.resource-entry svg{width:14px;height:14px}}

/* Subject story and bottom-up skill canvas */
[hidden]{display:none !important}
button{font-family:inherit}
.subject.node{border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;appearance:none;-webkit-appearance:none;color:inherit}
.subject.node:focus-visible{outline:2px solid #507F87;outline-offset:6px}
.subject.node:hover .sphere{filter:brightness(1.04)}
.subject.node:active .sphere{filter:brightness(.97)}
body.view-tree{overflow:hidden}
body.view-tree .constellation{visibility:hidden;pointer-events:none}
.story-overlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(249,250,245,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  color:#343B3B;
}
.story-stage{width:min(430px,94vw);text-align:center;padding:20px}
.story-art{display:block;width:100%;height:auto;overflow:visible}
.story-art .draw{fill:none;stroke:#353C3C;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.story-art .mascot{transform-origin:50% 70%;opacity:0}
.story-art .prop{transform-box:fill-box;transform-origin:center;opacity:0}
.story-caption{
  margin:22px 0 0;font-family:"Brain Hand","STKaiti","KaiTi",cursive;font-size:clamp(22px,5.9vw,31px);
  line-height:1.7;letter-spacing:.035em;opacity:0;white-space:nowrap;
}
.tree-screen{position:fixed;inset:0;z-index:10;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.tree-screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(239,248,242,.70),rgba(255,244,228,.73));
}
.tree-header{
  position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:12px;
  padding:calc(15px + env(safe-area-inset-top)) 18px 15px;
  background:linear-gradient(to bottom,rgba(243,250,244,.95),rgba(243,250,244,.57),transparent);
}
.tree-heading{min-width:0;flex:1}
.tree-heading h1{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:.04em}
.tree-heading p{margin:4px 0 0;font-size:11px;color:#667F7C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-action{
  flex-shrink:0;width:42px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(101,142,142,.20);border-radius:50%;background:rgba(255,255,249,.62);
  color:#3B6267;font-size:20px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.canvas-action:active{background:rgba(214,235,225,.90)}
.canvas-action:focus-visible,.skill-node:focus-visible,.text-action:focus-visible,.reader button:focus-visible{
  outline:2px solid #497B83;outline-offset:4px;
}
.tree-breadcrumb{
  position:absolute;left:18px;top:calc(87px + env(safe-area-inset-top));z-index:5;
  max-width:calc(100vw - 36px);display:flex;align-items:center;gap:8px;font-size:12px;color:#687F7E;
}
.text-action{padding:6px 10px;border:1px solid rgba(112,148,140,.23);border-radius:15px;background:rgba(255,255,247,.72);color:#355C61;font-size:12px;cursor:pointer}
.canvas-viewport{
  position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;outline:none;
  background-image:radial-gradient(rgba(91,135,137,.11) .7px,transparent .8px);background-size:25px 25px;
}
.canvas-viewport.dragging{cursor:grabbing}
.canvas-viewport:focus-visible{box-shadow:inset 0 0 0 2px rgba(69,122,129,.40)}
.canvas-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.canvas-edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.tree-edge{fill:none;stroke:#6C9496;stroke-width:1.35;stroke-linecap:round;opacity:.40;transition:opacity .15s}
.tree-edge.association{stroke:#859F9E;stroke-dasharray:5 7;opacity:.21;stroke-width:1.05}
.tree-edge.branch{stroke:#638D89;opacity:.48}
.tree-edge.highlight{opacity:.91;stroke-width:2}
.skill-node{
  position:absolute;display:flex;align-items:center;justify-content:center;width:230px;height:82px;
  padding:12px 17px;border:1px solid rgba(255,255,255,.90);border-radius:24px 24px 24px 10px;
  background:linear-gradient(138deg,rgba(255,255,255,.94),rgba(240,250,244,.78));
  color:#314F52;font-size:17px;font-weight:500;line-height:1.45;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.98),inset -1px -2px 2px rgba(88,128,126,.12),3px 10px 22px -10px rgba(70,113,116,.24);
  cursor:pointer;transition:border-color .18s,box-shadow .18s;
}
.skill-node .node-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.skill-node[data-tier="2"]{background:linear-gradient(138deg,rgba(255,255,255,.94),rgba(233,243,242,.78))}
.skill-node[data-tier="3"]{background:linear-gradient(138deg,rgba(255,253,245,.96),rgba(243,229,215,.80))}
.skill-node.point-node{width:220px;height:92px;border-radius:20px 20px 20px 8px;font-size:16px}
.skill-node.root-node{border:1px solid rgba(86,143,137,.61);box-shadow:0 0 0 5px rgba(205,230,218,.30),4px 14px 30px -14px rgba(70,113,116,.25)}
.skill-node.selected{border-color:#5B9698;box-shadow:0 0 0 3px rgba(111,180,188,.15),3px 10px 22px -10px rgba(70,113,116,.30)}
.skill-node:hover{border-color:rgba(87,146,146,.59)}
.tier-line{position:absolute;left:50px;right:50px;height:1px;background:linear-gradient(90deg,transparent,rgba(85,131,131,.18),transparent);pointer-events:none}
.tier-label{position:absolute;left:54px;transform:translateY(-27px);font-size:15px;color:#75908B;font-weight:400;letter-spacing:.13em;pointer-events:none}
.tree-tools{
  position:absolute;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px;border:1px solid rgba(255,255,255,.68);border-radius:25px;
  background:rgba(250,255,247,.70);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 22px -14px rgba(71,104,106,.28);
}
.tree-tools .canvas-action{width:36px;min-height:36px;border:0;background:transparent}
.tree-tools output{font-size:10px;color:#6A8280;padding:2px 0}
.tree-footer{
  position:absolute;left:0;right:0;bottom:0;z-index:5;padding:15px 17px calc(15px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(248,246,234,.95),rgba(248,246,234,.69),transparent);
  pointer-events:none;font-size:11px;color:#667E79;line-height:1.8;
}
.tree-footer .legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.legend-key{display:inline-flex;align-items:center;gap:5px}
.legend-stroke{display:inline-block;width:21px;border-top:1.4px solid #6C9496;position:relative}
.legend-stroke::after{content:"";position:absolute;right:-1px;top:-3px;width:4px;height:4px;border-right:1px solid #6C9496;border-top:1px solid #6C9496;transform:rotate(45deg)}
.legend-stroke.dashed{border-top-style:dashed}
.tree-footer button{pointer-events:auto}
.tier-notice{font-size:10px;color:#7E8E84;border:0;background:transparent;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.canvas-instructions{margin-top:5px;opacity:.80}
.empty-subject{
  position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;
  flex-direction:column;gap:15px;padding:80px 28px;pointer-events:none;
}
.empty-subject .empty-line{width:65px;height:1px;background:rgba(83,132,131,.30)}
.empty-subject h2{font-size:20px;font-weight:500;margin:0;color:#416165}
.empty-subject p{font-size:13px;line-height:1.8;max-width:270px;margin:0;color:#6F8580}
.reader-backdrop{position:fixed;inset:0;z-index:29;background:rgba(60,82,78,.12);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.reader{
  position:fixed;z-index:30;right:0;top:0;bottom:0;width:min(500px,47vw);display:flex;flex-direction:column;
  color:#314E50;background:rgba(249,252,246,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:-12px 0 50px -21px rgba(51,80,82,.25);border-left:1px solid rgba(255,255,255,.88);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
.reader-header{display:flex;align-items:flex-start;gap:14px;padding:calc(22px + env(safe-area-inset-top)) 24px 16px;border-bottom:1px solid rgba(97,135,128,.15)}
.reader-heading{flex:1;min-width:0}
.reader-heading p{font-size:11px;color:#83958D;margin:0 0 7px;line-height:1.5}
.reader-heading h2{font-size:21px;line-height:1.6;font-weight:600;margin:0}
.reader-header .canvas-action{width:35px;min-height:35px;font-size:19px;margin-top:2px}
.reader-content{overflow:auto;overscroll-behavior:contain;padding:20px 24px 34px;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#BDCDC1 transparent}
.reader .reading-note{font-size:11px;line-height:1.8;color:#788A81;padding:10px 12px;border-left:2px solid #AFCBBB;background:rgba(222,237,222,.31);margin:0 0 20px}
.reader article{font-size:14px;line-height:1.95;overflow-wrap:anywhere;color:#354F4F;max-width:76ch}
.reader article h2,.reader article h3,.reader article h4{font-size:16px;line-height:1.65;margin:25px 0 9px;color:#345E63;font-weight:600;letter-spacing:.02em}
.reader article h5,.reader article h6{font-size:14px;margin:20px 0 8px}
.reader article p{margin:9px 0}
.reader article strong{font-weight:600;color:#2E5257}
.reader article ul,.reader article ol{padding-left:23px;margin:9px 0}
.reader article li{margin:7px 0}
.reader article blockquote{border-left:2px solid #A9CBC1;margin:14px 0;padding:4px 13px;color:#6D8179;background:#EEF4EB}
.reader article hr{border:0;border-top:1px solid rgba(107,140,131,.17);margin:23px 0}
.reader article code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:.93em;background:rgba(221,235,222,.51);border-radius:4px;padding:1px 4px;white-space:pre-wrap}
.reader article pre{overflow:auto;max-width:100%;padding:12px;background:#EDF3E9;border-radius:10px;line-height:1.7}

.table-scroll{max-width:100%;overflow-x:auto;margin:15px 0;-webkit-overflow-scrolling:touch}

<script>(() => {
'use strict';
const scene=document.getElementById('constellation'),svg=document.getElementById('vectors'),subjects=[...scene.querySelectorAll('.subject')],ns='http://www.w3.org/2000/svg';
const reduce=matchMedia('(prefers-reduced-motion: reduce)');let last=0;
function node(tag,attrs){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));return e;}
function layout(animate=false){
 const width=scene.clientWidth;if(!width)return;last=width;const d=Math.min(91,width*.195),core=d*1.28,r=Math.min(width/2-d/2-14,scene.parentElement.clientHeight*.47-d/2-22);

 svg.setAttribute('viewBox',`0 0 ${width} ${width}`);svg.replaceChildren();
 const coreEl=scene.querySelector('.core .sphere');coreEl.getAnimations().forEach(a=>a.cancel());
 if(animate&&!reduce.matches)coreEl.animate([{opacity:0,transform:'scale(.1) translateY(22px)'},{opacity:1,transform:'scale(1.08) translateY(-5px)',offset:.7},{opacity:1,transform:'none'}],{duration:750,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});
 subjects.forEach((s,i)=>{const angle=Number(s.dataset.angle),a=angle*Math.PI/180;s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');
 const g=node('g',{transform:`translate(${width/2} ${width/2}) rotate(${angle})`}),length=r-d/2-6,line=node('line',{class:'vector',x1:core/2+4,y1:0,x2:length,y2:0}),head=node('path',{class:'vector',d:`M ${length-6} -3 L ${length} 0 L ${length-6} 3`});g.append(line,head);svg.append(g);
 const sphere=s.querySelector('.sphere');sphere.getAnimations().forEach(a=>a.cancel());
 if(animate&&!reduce.matches){g.animate([{opacity:0},{opacity:1}],{duration:570,delay:620+i*55,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});sphere.animate([{opacity:0,transform:'scale(.12)'},{opacity:1,transform:'scale(1.08)',offset:.75},{opacity:1,transform:'none'}],{duration:580,delay:1030+i*55,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});}
 });

// Delegated theme controls cover the map toolbar inserted after this script.
document.addEventListener('click',e=>{if(e.target.closest('[data-theme-switch]'))applyTheme(document.documentElement.dataset.theme==='night'?'porcelain':'night')});
applyTheme(document.documentElement.dataset.theme);
window.KBHome={layout,applyTheme};
})();</script>

<script>(() => {
  'use strict';
  const C={ink:'#314F52',teal:'#5C9EA7',clay:'#B77B60',sage:'#82966E',grid:'#CFDDD1',soft:'#E4EEE2'};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>String.fromCharCode(38)+({'&':'amp;','<':'lt;','>':'gt;','"':'quot;',"'":'#39;'}[c]));
  const f=(n,d=2)=>String(Number(Number(n).toFixed(d)));
  const rad=a=>a*Math.PI/180;
  const line=(x1,y1,x2,y2,color=C.ink,width=1.5,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
  const text=(x,y,label,extra='')=>`<text x="${x}" y="${y}" ${extra}>${esc(label)}</text>`;
  const circle=(x,y,r,fill,extra='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`;
  const path=(d,color=C.teal,width=2.4,extra='')=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const poly=(points,fill,extra='')=>`<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
  function arrow(x1,y1,x2,y2,color=C.teal,width=2.4,dashed=false){
    if(Math.hypot(x2-x1,y2-y1)<.01)return '';
    const a=Math.atan2(y2-y1,x2-x1),r=7,angle=.47;
    return line(x1,y1,x2,y2,color,width,dashed?'stroke-dasharray="4 4"':'')+path(`M ${x2-r*Math.cos(a-angle)} ${y2-r*Math.sin(a-angle)} L ${x2} ${y2} L ${x2-r*Math.cos(a+angle)} ${y2-r*Math.sin(a+angle)}`,color,width);
  }

  function fieldVector(x,y,charges){
    let ex=0,ey=0;for(const c of charges){const dx=x-c.x,dy=y-c.y,r2=dx*dx+dy*dy;if(r2<.012)return null;const k=c.q/Math.pow(r2,1.5);ex+=k*dx;ey+=k*dy;}return {x:ex,y:ey};
  }
  function traceField(start,charges,maxSteps=620){
    const pts=[start];let p={x:start.x,y:start.y};
    for(let i=0;i<maxSteps;i++){
      const v=fieldVector(p.x,p.y,charges);if(!v||Math.hypot(v.x,v.y)<1e-6)break;
      const norm=Math.hypot(v.x,v.y),step=.025;const mid={x:p.x+v.x/norm*step/2,y:p.y+v.y/norm*step/2};
      const m=fieldVector(mid.x,mid.y,charges);if(!m)break;const mn=Math.hypot(m.x,m.y);if(mn<1e-6)break;
      p={x:p.x+m.x/mn*step,y:p.y+m.y/mn*step};pts.push(p);
      if(Math.abs(p.x)>2.45||Math.abs(p.y)>1.77||charges.some(c=>c.q<0&&Math.hypot(p.x-c.x,p.y-c.y)<.16))break;
    }return pts;
  }

    $('tree-title').textContent=subject+'知识体系';
    const s=DATA.subjects[subject];
    $('tree-meta').textContent=s.ready?`${s.chapters.length} 个章节 · ${s.pointCount} 个知识点`:'资料待补';
    $('empty-subject').hidden=s.ready;$('tree-tools').hidden=!s.ready;$('tree-footer').hidden=!s.ready;$('tree-breadcrumb').hidden=true;
    $('empty-title').textContent=subject+'知识体系待补';
    closeReader(false);
    if(s.ready){renderMap(chapterLayout(subject));const previous=views.get(subject);if(previous&&!previous.chapter){Object.assign(state,{tx:previous.tx,ty:previous.ty,scale:previous.scale});paint();}else{locateBasic();}}
    else{world.replaceChildren();state.nodes=[];state.edges=[];state.positions=new Map();}
    if(push){history.pushState({subject},'', '#'+encodeURIComponent(subject));}
    $('back-home').focus({preventScroll:true});
  }
  function showHome(push=true){
    state.storyToken++;unlockStory();closeReader(false);
    if(state.subject)views.set(state.subject,{tx:state.tx,ty:state.ty,scale:state.scale,chapter:state.chapter});
    state.subject=null;state.chapter=null;screen.hidden=true;document.body.classList.remove('view-tree');document.querySelector('.constellation').inert=false;
    if(push){history.pushState({},'',location.pathname+location.search);}
    window.KBHome?.layout(false);updateResume();
    document.querySelector('.subject.node')?.focus({preventScroll:true});
  }
  function expandChapter(id,push=true){
    const c=DATA.chapters[id];if(!c)return;
    const subject=Object.keys(DATA.subjects).find(s=>DATA.subjects[s].key===id[0]);
    if(subject&&subject!==state.subject)openSubject(subject,false);
    state.chapter=id;renderMap(pointLayout(id));$('tree-breadcrumb').hidden=false;$('chapter-label').textContent=c.title;
    $('tree-meta').textContent=`${c.points.length} 个知识点 · 点击标题查看内容`;
    locateBasic();
    if(push)history.pushState({subject:state.subject,chapter:id},'', '#'+encodeURIComponent(state.subject)+'/'+id);
    openChapterReader(id);
  }
  function allChapters(push=true){
    closeReader(false);const subject=state.subject;if(!subject)return;
    state.chapter=null;renderMap(chapterLayout(subject));$('tree-breadcrumb').hidden=true;
    const s=DATA.subjects[subject];$('tree-meta').textContent=`${s.chapters.length} 个章节 · ${s.pointCount} 个知识点`;
    fitAll();if(push)history.pushState({subject},'', '#'+encodeURIComponent(subject));
  }
  function showReader(title,meta,content){
    if(reader.hidden)state.readerFocus=document.activeElement;
    $('reader-title').textContent=title;$('reader-meta').textContent=meta;$('reader-content').innerHTML=content;
    reader.hidden=false;$('reader-backdrop').hidden=false;screen.inert=true;document.querySelector('.entry').inert=true;
    $('reader-content').scrollTop=0;$('reader-close').focus({preventScroll:true});
    window.KBVisual?.mount($('reader-content'));
    if(!reduced.matches)reader.animate([{opacity:0,transform:innerWidth<=700?'translateY(24px)':'translateX(22px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,.7,.3,1)'});
  }
  function closeReader(focus=true){
    reader.hidden=true;$('reader-backdrop').hidden=true;screen.inert=false;document.querySelector('.entry').inert=false;
    if(focus){
      const target=state.readerFocus?.isConnected?state.readerFocus:viewport;
      target.focus({preventScroll:true});
    }
  }
  function relatedButtons(point){
    const refs=[...new Set([...point.prerequisites,...point.related])].filter(id=>id!==point.id && (DATA.points[id]||DATA.chapters[id]));
    if(!refs.length)return '';
    return '<h3>关联知识</h3><div class="point-links">'+refs.map(id=>`<button data-ref="${id}">${esc((DATA.points[id]||DATA.chapters[id]).title)}</button>`).join('')+'</div>';
  }
  function reliability(chapter){
    const c=DATA.chapters[chapter];
    return c.notes.length?'<details class="source-notes"><summary>原资料中的待核实说明</summary><article>'+c.notes.join('')+'</article></details>':'';
  }
  function openChapterReader(id){
    const c=DATA.chapters[id];
    const items=[...c.points].sort((a,b)=>DATA.points[a].tier-DATA.points[b].tier||a.localeCompare(b));
    const content=`<p class="reading-note">${esc(DATA.notice)}</p>`+items.map((code,i)=>`<details class="knowledge-section" data-point="${code}"${i===0?' open':''}><summary>${esc(DATA.points[code].title)}</summary><div class="point-detail"></div></details>`).join('')+reliability(id)+`<p class="reader-source">来源：${esc(c.sources.join('、'))}</p>`;
    showReader(c.title,`${id} · ${items.length} 个知识点`,content);
    const first=$('reader-content').querySelector('details[data-point]');if(first)fillPoint(first);
  }
  function fillPoint(details){
    if(details.dataset.loaded)return;
    const p=DATA.points[details.dataset.point];if(!p)return;
    details.querySelector('.point-detail').innerHTML=(window.KBVisual?.html(p.id)||'')+'<article>'+(window.KBVisual?.content(p.id,p.html)||p.html)+'</article>'+relatedButtons(p);details.dataset.loaded='true';
    window.KBVisual?.mount(details.querySelector('.point-detail'));
  }
  function highlight(id){
    state.selected=id;
    world.querySelectorAll('.skill-node').forEach(n=>n.classList.toggle('selected',n.dataset.id===id));
    world.querySelectorAll('.tree-edge').forEach(e=>e.classList.toggle('highlight',e.dataset.from===id||e.dataset.to===id));
  }
  function openPoint(id){
    const p=DATA.points[id];if(!p)return;highlight(id);
    const meta=[id,p.meta['教材']||''].filter(Boolean).join(' · ');
    showReader(p.title,meta,`<p class="reading-note">${esc(DATA.notice)}</p>${window.KBVisual?.html(p.id)||''}<article>${window.KBVisual?.content(p.id,p.html)||p.html}</article>${relatedButtons(p)}${reliability(p.chapter)}<p class="reader-source">来源：${esc(p.source)}</p>`);
  }

  // Pointer coordinates are in viewport pixels; node positions are world coordinates.
  function beginGesture(){
    const values=[...pointers.values()];
    if(values.length===1){gesture={type:'pan',start:values[0],tx:state.tx,ty:state.ty,moved:false};}
    else if(values.length>=2){const [a,b]=values;gesture={type:'pinch',distance:Math.hypot(b.x-a.x,b.y-a.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx:state.tx,ty:state.ty,scale:state.scale,moved:true};suppressClickUntil=performance.now()+450;}
  }
  viewport.addEventListener('pointerdown',event=>{
    if(event.pointerType==='mouse'&&event.button!==0)return;
    const rect=viewport.getBoundingClientRect();pointers.set(event.pointerId,{x:event.clientX-rect.left,y:event.clientY-rect.top});beginGesture();
    // Capture on the node when necessary, so ordinary taps still activate that node.
    try{event.target.setPointerCapture(event.pointerId);}catch(e){}
  });
  viewport.addEventListener('pointermove',event=>{
    if(!pointers.has(event.pointerId)||!gesture)return;
    const rect=viewport.getBoundingClientRect();pointers.set(event.pointerId,{x:event.clientX-rect.left,y:event.clientY-rect.top});const values=[...pointers.values()];
    if(gesture.type==='pinch'&&values.length>=2){
      const [a,b]=values,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,next=clampScale(gesture.scale*Math.hypot(b.x-a.x,b.y-a.y)/Math.max(gesture.distance,1));
      state.tx=cx-(gesture.cx-gesture.tx)*next/gesture.scale;state.ty=cy-(gesture.cy-gesture.ty)*next/gesture.scale;state.scale=next;requestPaint();suppressClickUntil=performance.now()+450;
    }else if(values.length===1){
      const p=values[0],dx=p.x-gesture.start.x,dy=p.y-gesture.start.y;
      if(Math.hypot(dx,dy)>5||gesture.moved){gesture.moved=true;state.tx=gesture.tx+dx;state.ty=gesture.ty+dy;requestPaint();viewport.classList.add('dragging');suppressClickUntil=performance.now()+350;}
    }
  });
  function endPointer(event){
    pointers.delete(event.pointerId);if(pointers.size)beginGesture();else{gesture=null;viewport.classList.remove('dragging');}
  }
  viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
  viewport.addEventListener('wheel',event=>{event.preventDefault();const r=viewport.getBoundingClientRect();zoomAt(state.scale*Math.exp(-event.deltaY*.0015),event.clientX-r.left,event.clientY-r.top);},{passive:false});
  world.addEventListener('click',event=>{
    if(performance.now()<suppressClickUntil)return;const n=event.target.closest('button[data-id]');if(!n)return;
    highlight(n.dataset.id);
    if(n.dataset.kind==='chapter')expandChapter(n.dataset.id);
    else if(n.dataset.kind==='root')openChapterReader(n.dataset.id);
    else openPoint(n.dataset.id);
  });
  world.addEventListener('focusin',event=>{
    const id=event.target.closest('button[data-id]')?.dataset.id;if(!id)return;
    const n=state.positions.get(id),r=event.target.getBoundingClientRect(),vr=viewport.getBoundingClientRect();
    if(n&&(r.left<vr.left||r.right>vr.right||r.top<vr.top+100||r.bottom>vr.bottom-10)){focusAt(n.x,n.y,Math.max(state.scale,.72));}
  });
  $('reader-content').addEventListener('toggle',event=>{if(event.target.matches('details[data-point]')&&event.target.open)fillPoint(event.target);},true);
  $('reader-content').addEventListener('click',event=>{
    const button=event.target.closest('button[data-ref]');if(!button)return;const id=button.dataset.ref;
    if(DATA.points[id]){if(state.chapter!==DATA.points[id].chapter)expandChapter(DATA.points[id].chapter);openPoint(id);}
    else if(DATA.chapters[id])expandChapter(id);
  });
  document.querySelectorAll('.subject.node').forEach(button=>button.addEventListener('click',()=>enterSubject(button.dataset.subject)));
  $('back-home').addEventListener('click',()=>showHome());
  $('chapter-back').addEventListener('click',()=>allChapters());
  $('fit-tree').addEventListener('click',fitAll);$('locate-basic').addEventListener('click',locateBasic);
  $('zoom-in').addEventListener('click',()=>zoomAt(state.scale*1.22));$('zoom-out').addEventListener('click',()=>zoomAt(state.scale/1.22));
  $('reader-close').addEventListener('click',()=>closeReader());$('reader-backdrop').addEventListener('click',()=>closeReader());
  $('tier-notice').addEventListener('click',()=>toast('章节难度按基础理解、串联运用、综合推断暂分；不是天津试题的统计难度。同一章可以含不同难度的知识点。'));
  document.addEventListener('keydown',event=>{
    if(state.busy&&event.key==='Escape'){event.preventDefault();cancelStory();return;}
    if(event.target.matches('input,select,textarea')&&event.key!=='Escape')return;
    if(!reader.hidden){
      if(event.key==='Escape'){event.preventDefault();closeReader();}
      if(event.key==='Tab'){
        const focusable=[...reader.querySelectorAll('button,summary,a,input,select,[tabindex]')].filter(e=>e.getClientRects().length);
        const first=focusable[0],last=focusable.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }
      return;
    }
    if(screen.hidden||state.busy)return;
    if(event.key==='Escape'){state.chapter?allChapters():showHome();return;}
    if(event.key==='+'||event.key==='='){event.preventDefault();zoomAt(state.scale*1.18);}
    else if(event.key==='-'){event.preventDefault();zoomAt(state.scale/1.18);}
    else if(event.key==='0'){event.preventDefault();fitAll();}
    else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
      event.preventDefault();if(event.key==='ArrowLeft')state.tx+=50;if(event.key==='ArrowRight')state.tx-=50;if(event.key==='ArrowUp')state.ty+=50;if(event.key==='ArrowDown')state.ty-=50;requestPaint();
    }
  });
  function restoreRoute(){
    state.storyToken++;state.busy=false;story.hidden=true;
    const [encoded,chapter]=location.hash.slice(1).split('/');let subject;try{subject=decodeURIComponent(encoded||'');}catch(e){subject='';}
    if(DATA.subjects[subject]){openSubject(subject,false);if(chapter&&DATA.chapters[chapter]&&DATA.subjects[subject].chapters.includes(chapter))expandChapter(chapter,false);}
    else showHome(false);
  }
  function updateResume(){
    let last;try{last=localStorage.getItem('kb-last-subject')}catch(e){}
    const resume=$('resume-study');resume.hidden=!DATA.subjects[last];if(!resume.hidden){resume.querySelector('strong').textContent=last;resume.dataset.subject=last;}
  }
  $('resume-study').addEventListener('click',()=>enterSubject($('resume-study').dataset.subject));updateResume();
  $('story-cancel').addEventListener('click',cancelStory);
  $('subject-switch').addEventListener('change',e=>enterSubject(e.target.value));
  const search=$('chapter-search'),results=$('search-results');
  search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase();if(!q||!state.subject){results.hidden=true;return;}
    const chapters=DATA.subjects[state.subject].chapters;
    const matches=[...chapters.map(id=>({id,title:DATA.chapters[id].title})),...chapters.flatMap(ch=>DATA.chapters[ch].points.map(id=>({id,title:DATA.points[id].title})))].filter(n=>(n.id+' '+n.title).toLowerCase().includes(q)).slice(0,12);
    results.replaceChildren();results.hidden=false;
    if(!matches.length){const p=document.createElement('p');p.textContent='没有匹配内容，试试章节名或编号。';results.append(p);}
    for(const n of matches){const b=document.createElement('button');b.type='button';b.textContent=n.title;b.dataset.target=n.id;results.append(b);}
  });
  results.addEventListener('click',e=>{const id=e.target.closest('button[data-target]')?.dataset.target;if(!id)return;results.hidden=true;search.value='';
    if(DATA.points[id]){expandChapter(DATA.points[id].chapter);openPoint(id);}else expandChapter(id);
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.map-search'))results.hidden=true;});
  window.KBHome?.applyTheme(document.documentElement.dataset.theme);

  window.addEventListener('popstate',restoreRoute);
  window.addEventListener('resize',()=>{if(!screen.hidden)requestPaint();});
  if(location.hash)restoreRoute();
  // Public read-only diagnostics; no credentials or private file paths are shipped.
  window.KBTree={version:'porcelain-atlas-20261003',dataVersion:DATA.version,counts:Object.fromEntries(Object.entries(DATA.subjects).map(([s,d])=>[s,{chapters:d.chapters.length,points:d.pointCount}])),getState:()=>({subject:state.subject,chapter:state.chapter,nodeCount:state.nodes.length,edgeCount:state.edges.length,scale:state.scale,tx:state.tx,ty:state.ty,busy:state.busy,readerOpen:!reader.hidden}),audit:DATA.audit};
})();</script>
<script>(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('resource-data').textContent);
  const screen = document.getElementById('resource-screen');
  const list = document.getElementById('resource-list');
  const empty = document.getElementById('resource-empty');
  const count = document.getElementById('resource-count');
  const notice = document.getElementById('resource-notice');
  const query = document.getElementById('resource-query');
  const subject = document.getElementById('resource-subject');
  const year = document.getElementById('resource-year');
  const type = document.getElementById('resource-type');
  const tags = document.getElementById('resource-tags');
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'"', "'":'&#39;'
  }[ch]));
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5"/></svg>';
  let quick = '';

  function matches(item) {
    const q = query.value.trim().toLowerCase();
    const text = [item.title, item.description, item.platform, item.type, item.subject, item.year, ...(item.tags || [])].join(' ').toLowerCase();
    return (!q || text.includes(q)) && (subject.value === 'all' || item.subject === subject.value) && (year.value === 'all' || item.year === year.value) && (type.value === 'all' || item.type === type.value) && (!quick || item.tags?.includes(quick) || item.type === quick || item.confidence === quick);
  }

  function render() {
    const filtered = DATA.items.filter(matches);
    count.textContent = `${filtered.length} 条资源`;
    empty.hidden = filtered.length > 0;
    list.innerHTML = filtered.map(item => {
      const tagsHtml = (item.tags || []).map(tag => `<span class="resource-tag">${escape(tag)}</span>`).join('');
      const duration = item.duration ? `<span class="resource-confidence">${escape(item.duration)}</span>` : '';
      return `<article class="resource-card" data-confidence="${escape(item.confidence)}">
        <div class="resource-card-head"><span class="resource-subject">${escape(item.subject)}</span><span class="resource-year">${escape(item.year)}</span><span class="resource-kind">${escape(item.type)}</span></div>
        <h2>${escape(item.title)}</h2>
        <p>${escape(item.description)}</p>
        <div class="resource-meta">${tagsHtml}${duration}<span class="resource-confidence">${escape(item.confidence)}</span></div>
        <a class="resource-link" href="${escape(item.url)}" target="_blank" rel="noopener noreferrer"><span>${escape(item.platform)} · 打开来源</span>${icon}</a>
      </article>`;
    }).join('');
  }

  function open() {
    screen.hidden = false;
    document.querySelector('.entry').inert = true;
    document.body.classList.add('resource-mode');
    render();
    document.getElementById('resource-query').focus({preventScroll:true});
    history.pushState({resource:true}, '', '#resources');
  }
  function close(push=true) {
    screen.hidden = true;
    document.querySelector('.entry').inert = false;
    document.body.classList.remove('resource-mode');
    if (push) history.pushState({}, '', location.pathname + location.search);
    document.getElementById('open-resources')?.focus({preventScroll:true});
  }

  [query, subject, year, type].forEach(input => ['input','change'].forEach(eventName => input.addEventListener(eventName, () => { quick=''; tags.querySelectorAll('button').forEach(b => b.classList.remove('active')); render(); })));
  tags.addEventListener('click', event => {
    const button = event.target.closest('button[data-quick]');
    if (!button) return;
    const next = quick === button.dataset.quick ? '' : button.dataset.quick;
    quick = next;
    tags.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === button && Boolean(next)));
    render();
  });
  document.getElementById('open-resources')?.addEventListener('click', open);
  document.getElementById('resource-back')?.addEventListener('click', () => close());
  window.addEventListener('popstate', () => { if (location.hash !== '#resources') close(false); });
  notice.textContent = DATA.notice;
  window.KBResource = { open, close, render, count: DATA.items.length };
})();</script>
